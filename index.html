   §9 UI — トースト・シート・テンキー
   ==================================================================== */
const Toast = {
  show(msg, opt){
    opt = opt || {};
    const host = $("#toasts");
    const el = document.createElement("div");
    el.className = "toast" + (opt.kind === "err" ? " err" : "");
    el.innerHTML = toHTML(html`<span class="msg">${msg}</span>`);
    if (opt.actionLabel){
      const b = document.createElement("button");
      b.textContent = opt.actionLabel;
      b.addEventListener("click", () => { el.remove(); opt.onAction && opt.onAction(); });
      el.appendChild(b);
    } else if (opt.ms === 0){
      const b = document.createElement("button");
      b.textContent = "閉じる";
      b.addEventListener("click", () => el.remove());
      el.appendChild(b);
    }
    host.appendChild(el);
    // 積み上がると古いものが操作の邪魔になるので、画面に出すのは3つまで
    while (host.children.length > 3) host.firstElementChild.remove();
    const ms = opt.ms === 0 ? 0 : (opt.ms || 4200);
    if (ms) setTimeout(() => el.remove(), ms);
    return el;
  },
  undo(msg, onUndo){ return Toast.show(msg, { actionLabel:"取り消す", onAction:onUndo, ms:6500 }); },
};

function openSheet(id){ const d = $(id); if (d && !d.open) d.showModal(); }
function closeSheet(id){ const d = $(id); if (d && d.open) d.close(); }

/* --- 入力シートの状態（テンキー込み） --- */
const Entry = {
  open:false, editId:null,
  // type は expense / income / transfer。transfer は貯蓄・投資（消費ではない）
  type:"expense", incomeKind:"refund",
  date:"", categoryId:null, methodId:null, detail:"",
  acc:null, op:null, cur:"0",

  reset(pre){
    const cats = Sel.entryCategories("expense");
    const mths = Sel.activeMethods();
    this.editId = null;
    this.type = "expense"; this.incomeKind = "refund";
    this.date = todayStr();
    this.categoryId = (cats[0] && cats[0].id) || null;
    this.methodId   = (mths[0] && mths[0].id) || null;
    this.detail = "";
    this.acc = null; this.op = null; this.cur = "0";
    if (pre) Object.assign(this, pre);
  },
  loadTx(t){
    this.reset();
    this.editId = t.id; this.type = t.type; this.incomeKind = t.incomeKind || "refund";
    this.date = t.date; this.categoryId = t.categoryId; this.methodId = t.methodId;
    this.detail = t.detail || ""; this.cur = String(t.amount);
  },
  /* 式は {acc, op, cur} の3変数だけ。eval もパーサも使わない。
     円なので整数だけ扱えばよく、浮動小数点誤差が原理的に発生しない。 */
  value(){
    const cur = parseInt(this.cur, 10) || 0;
    if (this.op === "+") return (this.acc || 0) + cur;
    if (this.op === "-") return (this.acc || 0) - cur;
    return cur;
  },
  exprText(){
    if (this.op == null) return "";
    return (this.acc||0).toLocaleString("ja-JP") + " " + (this.op === "+" ? "＋" : "−") + " " + (parseInt(this.cur,10)||0).toLocaleString("ja-JP");
  },
  key(k){
    if (/^[0-9]$/.test(k)){ this.cur = this.cur === "0" ? k : (this.cur.length < 10 ? this.cur + k : this.cur); }
    else if (k === "00"){ if (this.cur !== "0") this.cur = (this.cur + "00").slice(0,10); }
    else if (k === "back"){ this.cur = this.cur.length > 1 ? this.cur.slice(0,-1) : "0"; }
    else if (k === "clear"){ this.acc = null; this.op = null; this.cur = "0"; }
    else if (k === "+" || k === "-"){
      const v = this.value();
      this.acc = v; this.op = k; this.cur = "0";
    }
    View.entrySheet();
  },
};

/* --- 支払方法の編集フォーム（カードは締め日つきの支払方法として扱う） --- */
const MethodForm = {
  id:null, name:"", kind:"cash", billing:null,
  reset(){ this.id = null; this.name = ""; this.kind = "cash"; this.billing = null; },
  load(m){
    this.id = m.id; this.name = m.name; this.kind = m.kind;
    this.billing = m.billing ? JSON.parse(JSON.stringify(m.billing)) : null;
    if (this.billing) this.kind = "card";
  },
  ensureBilling(){
    if (!this.billing) this.billing = { accountId:null, closeType:"毎月指定日", closeDay:15,
      payOffset:1, payDayType:"date", payDay:27, holidayAdjust:"翌営業日" };
  },
  read(){
    const g = id => { const el = $("#" + id); return el ? el.value : null; };
    if (g("mf-name") != null) this.name = g("mf-name").trim();
    if (this.kind === "card"){
      this.ensureBilling();
      const b = this.billing;
      if (g("mf-account")  != null) b.accountId  = g("mf-account") || null;
      if (g("mf-closetype")!= null) b.closeType  = g("mf-closetype");
      if (g("mf-closeday") != null) b.closeDay   = Math.min(31, Math.max(1, Number(g("mf-closeday")) || 1));
      if (g("mf-payoffset")!= null) b.payOffset  = Number(g("mf-payoffset"));
      if (g("mf-paydaytype")!=null) b.payDayType = g("mf-paydaytype");
      if (g("mf-payday")   != null) b.payDay     = Math.min(31, Math.max(1, Number(g("mf-payday")) || 1));
      if (g("mf-holiday")  != null) b.holidayAdjust = g("mf-holiday");
    }
  },
  save(){
    this.read();
    if (!this.name){ Toast.show("名前を入力してください", {kind:"err"}); return; }
    const dup = Store.state.methods.some(m => m.id !== this.id && !m.archived && m.name === this.name);
    if (dup){ Toast.show("同じ名前の支払方法があります", {kind:"err"}); return; }
    const payload = { name:this.name, kind:this.kind,
                      billing: this.kind === "card" ? this.billing : null };
    if (this.id){
      const id = this.id;
      Store.commit(s => Object.assign(byId(s.methods, id), payload), D.METHOD);
    } else {
      Store.commit(s => s.methods.push(Object.assign(
        { id:uid("mth"), order:s.methods.length, archived:false }, payload)), D.METHOD);
    }
    closeSheet("#sheet-detail");
    View.settings();
    Toast.show("保存しました");
  },
};

/* --- サブスクの編集フォーム --- */
const SubForm = {
  id:null, name:"", amount:"", methodId:null, categoryId:CAT_SUB,
  interval:"月次", start:"", end:"", status:"有効", pauseFrom:"", pauseTo:"", memo:"",
  reset(){
    const m = Sel.activeMethods()[0];
    Object.assign(this, { id:null, name:"", amount:"", methodId: m ? m.id : null,
      categoryId:CAT_SUB, interval:"月次", start:todayStr(), end:"", status:"有効",
      pauseFrom:"", pauseTo:"", memo:"" });
  },
  load(x){
    Object.assign(this, { id:x.id, name:x.name, amount:String(x.amount), methodId:x.methodId,
      categoryId:x.categoryId || CAT_SUB, interval:x.interval, start:x.start, end:x.end || "",
      status:x.status, pauseFrom:x.pauseFrom || "", pauseTo:x.pauseTo || "", memo:x.memo || "" });
  },
  read(){
    const g = id => { const el = $("#" + id); return el ? el.value : null; };
    ["name","amount","start","end","memo","pauseFrom","pauseTo"].forEach(k => {
      const v = g("sf-" + k.toLowerCase());
      if (v != null) this[k] = v;
    });
  },
  save(){
    this.read();
    const amount = Math.abs(Math.round(Number(this.amount) || 0));
    if (!this.name.trim()){ Toast.show("サービス名を入力してください", {kind:"err"}); return; }
    if (!amount){ Toast.show("金額を入力してください", {kind:"err"}); return; }
    if (!this.start){ Toast.show("開始日を入力してください", {kind:"err"}); return; }
    if (this.status === "解約予定" && !this.end){ Toast.show("解約予定は「いつまで」を入れてください", {kind:"err"}); return; }
    const payload = {
      name:this.name.trim(), amount, methodId:this.methodId, categoryId:this.categoryId,
      interval:this.interval, start:this.start, end:this.end || null, status:this.status,
      pauseFrom:this.pauseFrom || null, pauseTo:this.pauseTo || null, memo:this.memo || "",
    };
    if (this.id){
      const id = this.id;
      Store.commit(s => Object.assign(byId(s.subscriptions, id), payload), D.SUB);
    } else {
      Store.commit(s => s.subscriptions.push(Object.assign({ id:uid("sub") }, payload)), D.SUB);
    }
    closeSheet("#sheet-detail");
    View.settings();
    Toast.show("保存しました");
  },
};

function openForm(kind){
  if (kind === "method") View.methodForm(); else View.subForm();
  openSheet("#sheet-detail");
}

View._budget = function(mk){
  const { totals } = Sel.monthTotals(mk);
  const cats = Sel.activeCategories().filter(c => c.id !== CAT_UNCAT || (totals[CAT_UNCAT]||0) !== 0);
  let bTotal = 0, sTotal = 0;

  const rows = cats.map(c => {
    const spent = totals[c.id] || 0;
    const budget = Sel.budgetOf(mk, c.id);
    bTotal += budget; sTotal += spent;
    const g = Sel.gauge(spent, budget);
    const rem = budget > 0
      ? (spent > budget
          ? html`<span class="rem over">${yen(spent-budget)} 超過</span>`
          : html`<span class="rem ${g.level}">残り ${yen(budget-spent)}</span>`)
      : html`<span class="rem none">予算未設定</span>`;
    return html`
      <div class="bud-row">
        <div class="bud-top">
          <span class="sw" style="background:${raw(slotVar(c.colorSlot))}"></span>
          <span class="nm">${(c.icon ? c.icon+" " : "") + c.name}</span>
          <input type="number" inputmode="numeric" min="0" placeholder="予算" value="${budget || ""}"
                 data-budget-cat="${c.id}" aria-label="${c.name}の予算">
        </div>
        <div class="gauge-track"><div class="gauge-fill ${g.level}" style="width:${g.pct.toFixed(1)}%"></div></div>
        <div class="bud-bot"><span class="muted">使用 ${yen(spent)}</span>${rem}</div>

View._trend = function(mk){
  const data = Sel.trend(mk, 12);
  const spent = data.map(d => d.expense).filter(v => v > 0);
  const avg = spent.length ? spent.reduce((a,b)=>a+b,0) / spent.length : 0;
  const cur = data[data.length-1], prev = data[data.length-2];
  const diff = prev ? cur.expense - prev.expense : 0;

  return html`
    <div class="panel">
      <h2>収支の推移</h2>
      <p class="note">直近12ヶ月。棒をタップすると内訳が出ます。</p>
      <div class="keys">
        <span><i style="background:var(--s2)"></i>支出</span>
        <span><i style="background:var(--s1)"></i>収入</span>
      </div>
      ${Chart.trend(data)}
    </div>

    <div class="cols">
      <div class="panel">
        <h2>先月との比較</h2>
        ${prev
          ? html`<div class="pace">
              <div><div class="k">今月の支出</div><div class="v">${yen(cur.expense)}</div></div>
              <div><div class="k">先月との差</div>
                   <div class="v" style="color:${diff>0?"var(--red)":"var(--accent)"}">${diff>0?"+":""}${yen(diff)}</div></div>
              <div><div class="k">12ヶ月平均</div><div class="v">${yen(avg)}</div></div>
            </div>`
          : html`<p class="note mb0">比較できる月がまだありません。</p>`}
      </div>

      <div class="panel">
        <h2>月ごとの一覧</h2>
        <div class="legend">
          ${data.slice().reverse().map(d => html`
            <button class="legend-row" data-act="status:gomonth" data-mk="${d.monthKey}">
              <span class="nm">${d.y}年${d.m}月</span>
              <span class="pc">収入 ${yen(d.income)}</span>
              <span class="vl">${yen(d.expense)}</span>
            </button>`)}
        </div>
      </div>
    </div>`;
};

/* --- 履歴 --- */
const HistoryUI = { month: null, q:"", methodId:"", categoryId:"", mode:"list", min:"", max:"" };

View.history = function(){
  if (HistoryUI.mode === "calendar") return View._calendar();
  const host = $('[data-route="history"]');
  if (!HistoryUI.month){
    const n = new Date(); HistoryUI.month = monthKeyOf(n.getFullYear(), n.getMonth()+1);
  }
  const mk = HistoryUI.month;
  const [a,b] = monthRange(mk);
  let entries = Sel.entriesInRange(a,b);

  const q = HistoryUI.q.trim().toLowerCase();
  if (q) entries = entries.filter(e =>
    (e.label||"").toLowerCase().includes(q) || Sel.cat(e.categoryId).name.toLowerCase().includes(q));
  if (HistoryUI.methodId)   entries = entries.filter(e => e.methodId === HistoryUI.methodId);
  if (HistoryUI.categoryId) entries = entries.filter(e => e.categoryId === HistoryUI.categoryId);
  const min = Number(HistoryUI.min), max = Number(HistoryUI.max);
  if (HistoryUI.min !== "" && Number.isFinite(min)) entries = entries.filter(e => e.amount >= min);
  if (HistoryUI.max !== "" && Number.isFinite(max)) entries = entries.filter(e => e.amount <= max);
  const filtered = !!(q || HistoryUI.methodId || HistoryUI.categoryId || HistoryUI.min !== "" || HistoryUI.max !== "");

  // 日ごとにまとめる
  const days = [];
  let cur = null;
  for (const e of entries){
    if (!cur || cur.date !== e.date){ cur = { date:e.date, items:[], sum:0 }; days.push(cur); }
    cur.items.push(e);
    cur.sum += e.type === "transfer" ? 0
             : e.type === "income" && e.incomeKind === "earning" ? 0
             : e.type === "income" ? -e.amount : e.amount;
  }
  const [y,m] = mk.split("-").map(Number);
  const total = entries.reduce((s,e)=> s + (e.type==="transfer" ? 0 : e.type==="income" && e.incomeKind==="earning" ? 0 : e.type==="income" ? -e.amount : e.amount), 0);

  mount(host, html`
    <div class="panel">
      <div class="month-switch">
        <button data-act="hist:month" data-d="-1" aria-label="前の月">‹</button>
        <div class="label num">${y}年${m}月</div>
        <button data-act="hist:month" data-d="1" aria-label="次の月">›</button>
      </div>
      <div class="seg" role="group" aria-label="表示" style="margin-bottom:10px">
        <button data-act="hist:mode" data-v="list"     aria-pressed="${String(HistoryUI.mode==="list")}">一覧</button>
        <button data-act="hist:mode" data-v="calendar" aria-pressed="${String(HistoryUI.mode==="calendar")}">カレンダー</button>
      </div>
      <input type="search" id="hist-q" placeholder="🔍 メモ・用途で検索" value="${HistoryUI.q}" data-act="noop">
      <div class="grid" style="margin-top:8px">
        <label class="field">金額（以上）
          <input type="number" id="hist-min" inputmode="numeric" min="0" placeholder="指定なし" value="${HistoryUI.min}">
        </label>
        <label class="field">金額（以下）
          <input type="number" id="hist-max" inputmode="numeric" min="0" placeholder="指定なし" value="${HistoryUI.max}">
        </label>
      </div>
      <div class="chip-row" style="margin-top:8px">
        <button class="chip" data-act="hist:mth" data-id="" aria-pressed="${String(!HistoryUI.methodId)}">すべての支払方法</button>
        ${Sel.activeMethods().map(x => html`<button class="chip" data-act="hist:mth" data-id="${x.id}" aria-pressed="${String(HistoryUI.methodId===x.id)}">${x.name}</button>`)}
      </div>
      <div class="chip-row">
        <button class="chip" data-act="hist:cat" data-id="" aria-pressed="${String(!HistoryUI.categoryId)}">すべての用途</button>
        ${Sel.activeCategories().map(x => html`<button class="chip" data-act="hist:cat" data-id="${x.id}" aria-pressed="${String(HistoryUI.categoryId===x.id)}">${(x.icon?x.icon+" ":"")+x.name}</button>`)}
      </div>
      <div class="total-box"><div class="lbl">${filtered ? "この条件の合計" : "この月の合計"}（${entries.length}件）</div><div class="val num">${yen(total)}</div></div>
      ${filtered ? html`<div class="btn-row"><button class="btn ghost small" data-act="hist:clear">絞り込みを解除</button></div>` : ""}
    </div>

    <div class="panel">
      ${days.length === 0
        ? html`<div class="empty"><span class="big">🗒️</span>この月にはまだ記録がありません。<br>右下の ＋ から記録できます。</div>`
        : days.map(d => html`
            <div class="day-head" data-day="${d.date}"${HistoryUI.focusDate === d.date ? ' style="color:var(--accent)"' : ""}><span>${jpDate(d.date)}</span><span class="num">${yen(d.sum)}</span></div>
            <div class="rows">
              ${d.items.map(e => html`
                <button class="row" data-act="${e.source==="tx" ? "tx:edit" : "noop"}" data-id="${e.id}">
                  <span class="swatch" style="background:${raw(Sel.catColor(e.categoryId))}"></span>
                  <span class="main">
                    <span class="l1">${e.label}${e.source==="sub" ? raw(' <span class="tag gray">サブスク</span>') : ""}</span>
                    <span class="l2">${Sel.cat(e.categoryId).name} ・ ${Sel.mth(e.methodId).name}${e.type==="transfer" ? " ・ 貯蓄・投資" : e.type==="income" ? (e.incomeKind==="earning" ? " ・ 収入" : " ・ 立替精算") : ""}</span>
                  </span>
                  <span class="amt num ${e.type==="income" ? "in" : e.type==="transfer" ? "sv" : ""}">${e.type==="income" ? "+" : ""}${yen(e.amount)}</span>
                </button>`)}
            </div>`)}
    </div>
  `);
};

/* --- カレンダー: 日ごとの支出と、カードの引き落とし日 --- */
View._calendar = function(){
  const host = $('[data-route="history"]');
  if (!HistoryUI.month){
    const n = new Date(); HistoryUI.month = monthKeyOf(n.getFullYear(), n.getMonth()+1);
  }
  const mk = HistoryUI.month;
  const [y,m] = mk.split("-").map(Number);
  // 濃さは 0.14〜0.76 に収める。濃くしすぎると上に載る数字が読めなくなる
  const { cells, max } = Sel.calendar(mk);
  const t = Sel.monthTotals(mk);
  const today = todayStr();

  mount(host, html`
    <div class="panel">
      <div class="month-switch">
        <button data-act="hist:month" data-d="-1" aria-label="前の月">‹</button>
        <div class="label num">${y}年${m}月</div>
        <button data-act="hist:month" data-d="1" aria-label="次の月">›</button>
      </div>
      <div class="seg" role="group" aria-label="表示">
        <button data-act="hist:mode" data-v="list"     aria-pressed="${String(HistoryUI.mode==="list")}">一覧</button>
        <button data-act="hist:mode" data-v="calendar" aria-pressed="${String(HistoryUI.mode==="calendar")}">カレンダー</button>
      </div>
      <div class="total-box" style="margin-top:12px">
        <div class="lbl">この月の支出</div><div class="val num">${yen(t.expense)}</div>
      </div>
    </div>

    <div class="panel">
      <p class="note">日付をタップするとその日の記録を開きます。色の濃さは使った額の多さです。🔻 はカードの引き落とし日です。</p>
      <div class="cal-head">
        ${WD_JP.map((w,i) => html`<div class="${i===0?"sun":i===6?"sat":""}">${w}</div>`)}
      </div>
      <div class="cal">
        ${cells.map(c => c === null
          ? html`<div class="cal-cell empty"></div>`
          : html`
            <button class="cal-cell${c.date === today ? " today" : ""}${c.n ? "" : " none"}"
                    data-act="cal:day" data-d="${c.date}"
                    aria-label="${m}月${c.d}日 支出 ${yen(c.spend)}${c.pay ? " 引き落とし " + yen(c.pay.total) : ""}">
              <span class="d ${c.holiday || c.weekend ? (new Date(y,m-1,c.d).getDay()===6 ? "sat" : "sun") : ""}">${c.d}</span>
              ${c.spend > 0
                ? html`<span class="bar" style="opacity:${(0.14 + 0.62 * (c.spend / max)).toFixed(2)}"></span>
                       <span class="v">${c.spend >= 10000 ? (c.spend/10000).toFixed(1)+"万" : Math.round(c.spend/100)/10+"千"}</span>`
                : html`<span class="v muted">${c.income > 0 ? "+" : ""}</span>`}
              ${c.pay ? html`<span class="pay" title="${c.pay.names.join("・")}">🔻</span>` : ""}
            </button>`)}
      </div>
    </div>`);
};

/* サブスク。v1では「有効」以外は全部同じ扱いで、一時停止も解約予定も黙って無視
   されていた。ここでは4状態それぞれに意味を持たせている。 */
View._subs = function(){
  const subs = Store.state.subscriptions;
  const active = subs.filter(x => x.status === "有効" || x.status === "解約予定");
  const monthly = active.reduce((a,x) => a + Sel.monthlyEquivalent(x), 0);

  const badge = x =>
    x.status === "有効"     ? html`<span class="tag">有効</span>`
  : x.status === "一時停止" ? html`<span class="tag gold">一時停止</span>`
  : x.status === "解約予定" ? html`<span class="tag red">解約予定</span>`
  :                           html`<span class="tag gray">停止</span>`;

  const nextOf = x => {
    const occ = Sel.subOccurrences(x, new Date(), new Date(Date.now() + 400*86400000));
    return occ.length ? fmt(occ[0].date) : null;
  };

  return html`
    <div class="panel">
      <h2>サブスク・固定費</h2>
      <p class="note">毎月・毎週・毎年の支払いを登録すると、集計にも支払予定にも自動で反映されます。記録として入力する必要はありません（入力すると二重に数えられます）。</p>
      ${subs.length === 0
        ? html`<div class="empty" style="padding:22px"><span class="big">🔁</span>まだ登録がありません。</div>`
        : subs.map(x => {
            const nx = nextOf(x);
            return html`
              <div class="item">
                <div class="body">
                  <div class="t1">${x.name} ${badge(x)}</div>
                  <div class="t2">${x.interval} ・ ${Sel.mth(x.methodId).name} ・ ${Sel.cat(x.categoryId).name}${
                    nx ? "　次回 " + jpDate(nx)
                       : x.status === "有効" ? "　次回の予定なし" : ""}${
                    x.status === "一時停止" && x.pauseFrom ? "　停止 " + x.pauseFrom + (x.pauseTo ? " 〜 " + x.pauseTo : " 〜") : ""}${
                    x.status === "解約予定" && x.end ? "　" + x.end + " まで" : ""}</div>
                </div>
                <div class="amt">${yen(x.amount)}</div>
                <div class="acts">
                  <button class="icon-sm" data-act="sub:edit" data-id="${x.id}" aria-label="${x.name}を編集">✏️</button>
                  <button class="icon-sm danger" data-act="sub:delete" data-id="${x.id}" aria-label="${x.name}を削除">🗑</button>
                </div>
              </div>`;
          })}
      <div class="total-box">
        <div class="lbl">月あたりの合計（週次・年次も換算）</div>
        <div class="val">${yen(monthly)}</div>
      </div>
      <div class="btn-row"><button class="btn" data-act="sub:new">＋ サブスクを追加</button></div>
    </div>`;
};

/* ====================================================================
   ACTIONS — クリックは document 1箇所に集約する。
   innerHTML を差し替えてもハンドラが孤立しないので差分再描画が安全になる。
   ==================================================================== */
const Actions = {
  noop(){},
  go({to}){ go(to); },

  "theme:cycle"(){
    const order = ["auto","light","dark"];
    const next = order[(order.indexOf(Store.state.prefs.theme)+1) % 3];
    Actions["theme:set"]({ v: next });
  },
  "theme:set"({v}){
    Store.commit(s => { s.prefs.theme = v; }, D.PREF);
    if (v === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = v;
    View.appbar();
    if (currentRoute() === "settings") View.settings();
  },

  /* --- 入力 --- */
  "entry:open"(){ Entry.reset(); View.entrySheet(); openSheet("#sheet-entry"); },
  "entry:close"(){ closeSheet("#sheet-entry"); },
  "sheet:close"(){ closeSheet("#sheet-detail"); },
  "entry:type"({v}){
    syncEntryInputs();
    const before = Entry.type;
    if (v === "expense")      { Entry.type = "expense"; }
    else if (v === "transfer"){ Entry.type = "transfer"; }
    else                      { Entry.type = "income"; Entry.incomeKind = v; }
    // 支出用と貯蓄用で用途の一覧が別なので、行き来したら選び直す
    const wasTransfer = before === "transfer", isTransfer = Entry.type === "transfer";
    if (wasTransfer !== isTransfer){
      const list = Sel.entryCategories(Entry.type);
      Entry.categoryId = list.length ? list[0].id : null;
    }
    View.entrySheet();
  },
  "entry:tpl"({id}){
    const t = Sel.templates().find(x => x.id === id);
    if (!t) return;
    syncEntryInputs();
    Entry.categoryId = t.categoryId;
    Entry.methodId   = t.methodId;
    Entry.detail     = t.detail || "";
    Entry.type = "expense";
    // 金額が未入力のときだけ、よく使う金額を入れておく
    if (Entry.value() === 0 && t.amount){ Entry.acc = null; Entry.op = null; Entry.cur = String(t.amount); }
    View.entrySheet();
  },
  "entry:savetpl"(){
    syncEntryInputs();
    if (!Entry.categoryId || !Entry.methodId){ Toast.show("用途と支払方法を選んでください", {kind:"err"}); return; }
    const label = (Entry.detail || Sel.cat(Entry.categoryId).name).trim();
    const dup = (Store.state.templates || []).some(t =>
      t.categoryId === Entry.categoryId && t.methodId === Entry.methodId && (t.detail || "") === Entry.detail);
    if (dup){ Toast.show("同じ組み合わせが登録済みです"); return; }
    const amount = Entry.value() || null;
    const id = uid("tpl");
    Store.commit(s => {
      if (!Array.isArray(s.templates)) s.templates = [];
      s.templates.push({ id, label, amount, categoryId:Entry.categoryId, methodId:Entry.methodId, detail:Entry.detail });
    }, D.UI);
    View.entrySheet();
    Toast.undo("「" + label + "」を登録しました", () => {
      Store.commit(s => { s.templates = s.templates.filter(t => t.id !== id); }, D.UI);
      View.entrySheet();
    });
  },
  "entry:cat"({id}){ syncEntryInputs(); Entry.categoryId = id; View.entrySheet(); },
  "entry:mth"({id}){ syncEntryInputs(); Entry.methodId = id; View.entrySheet(); },
  key({k}){ Entry.key(k); },

  "entry:save"(){
    syncEntryInputs();
    const amount = Entry.value();
    if (!amount || amount <= 0){ Toast.show("金額を入力してください", {kind:"err"}); return; }
    if (!Entry.categoryId || !Entry.methodId){ Toast.show("用途と支払方法を選んでください", {kind:"err"}); return; }
    const payload = {
      date: Entry.date, amount, type: Entry.type,
      incomeKind: Entry.type === "income" ? Entry.incomeKind : null,

/** 先月の予算／実績を今月にコピーする。0も明示的な値として書き込む。 */
function copyBudget(kind){
  const mk = statusMonth();
  const [y,m] = mk.split("-").map(Number);
  const [py,pm] = addMonths(y, m, -1);
  const prevKey = monthKeyOf(py,pm);
  const prevTotals = Sel.monthTotals(prevKey).totals;
  const cats = Sel.activeCategories();

  const before = JSON.stringify(Store.state.budgets[mk] || null);
  let n = 0;
  Store.commit(s => {
    const dst = s.budgets[mk] = Object.assign({}, s.budgets[mk]);
    cats.forEach(c => {
      const v = kind === "actual" ? Math.max(0, Math.round(prevTotals[c.id] || 0)) : Sel.budgetOf(prevKey, c.id);
      if (v > 0){ dst[c.id] = v; n++; }
    });
  }, D.BUDGET);

  if (!n){ Toast.show("先月に" + (kind === "actual" ? "実績" : "予算") + "がありませんでした", {kind:"err"}); return; }
  View.status();
  Toast.undo(n + "件の用途に反映しました", () => {
    Store.commit(s => {
      if (before === "null") delete s.budgets[mk]; else s.budgets[mk] = JSON.parse(before);
    }, D.BUDGET);
    View.status();
  });
}

/** 節約診断のテキスト。既定は要約だけ。明細は明示的に選んだときだけ。 */
function buildAnalysisText(months, includeRows){
  const L = [];
  const now = new Date();
  const mk0 = monthKeyOf(now.getFullYear(), now.getMonth()+1);
  const data = Sel.trend(mk0, months);

  L.push("【家計簿データ／節約診断用】");
  L.push("これは家計簿アプリから書き出した集計です。使いすぎている用途と、減らせそうなところを具体的に指摘してください。");
  L.push("金額はすべて日本円です。");
  L.push("");
  L.push(`対象期間: ${data[0].y}年${data[0].m}月 〜 ${data[data.length-1].y}年${data[data.length-1].m}月（${months}ヶ月）`);
  L.push("");

  L.push("※ 貯蓄・投資への積立は「使ったお金」ではないため、支出には含めていません。");
  L.push("");
  L.push("■ 月ごとの収支");
  data.forEach(d => L.push(`${d.y}/${pad2(d.m)}  支出 ${Math.round(d.expense).toLocaleString("ja-JP")} / 収入 ${Math.round(d.income).toLocaleString("ja-JP")}`
    + (d.saving ? ` / 貯蓄 ${Math.round(d.saving).toLocaleString("ja-JP")}` : "")
    + ` / 差引 ${Math.round(d.net).toLocaleString("ja-JP")}`));
  const sumEx = data.reduce((a,d)=>a+d.expense,0);
  L.push(`合計 支出 ${Math.round(sumEx).toLocaleString("ja-JP")} / 月平均 ${Math.round(sumEx/months).toLocaleString("ja-JP")}`);
  L.push("");

  L.push("■ 用途別（期間合計と月平均）");
  const per = {};
  data.forEach(d => {
    const t = Sel.monthTotals(d.monthKey).totals;
    Object.entries(t).forEach(([id,v]) => { per[id] = (per[id]||0) + v; });
  });
  Object.entries(per).filter(([,v]) => v !== 0).sort((a,b) => b[1]-a[1])
    .forEach(([id,v]) => L.push(`${Sel.cat(id).name}  ${Math.round(v).toLocaleString("ja-JP")}（月平均 ${Math.round(v/months).toLocaleString("ja-JP")}）`));
  L.push("");

  const last = data[data.length-1];
  const cats = Sel.activeCategories().filter(c => Sel.budgetOf(last.monthKey, c.id) > 0);
  if (cats.length){
    L.push(`■ 直近月（${last.y}/${pad2(last.m)}）の予算と実績`);
    const t = Sel.monthTotals(last.monthKey).totals;
    cats.forEach(c => {
      const b = Sel.budgetOf(last.monthKey, c.id), a = Math.round(t[c.id] || 0);
      L.push(`${c.name}  予算 ${b.toLocaleString("ja-JP")} / 実績 ${a.toLocaleString("ja-JP")} / ${a > b ? "超過 " + (a-b).toLocaleString("ja-JP") : "残り " + (b-a).toLocaleString("ja-JP")}`);
    });
    L.push("");
  }

  const sumSave = data.reduce((a,d) => a + (d.saving || 0), 0);
  if (sumSave > 0){
    L.push("■ 貯蓄・投資（支出には含めていない）");
    L.push(`期間合計 ${Math.round(sumSave).toLocaleString("ja-JP")} / 月平均 ${Math.round(sumSave/months).toLocaleString("ja-JP")}`);
    L.push("");
  }

  const subs = Store.state.subscriptions.filter(x => x.status === "有効" || x.status === "解約予定");
  if (subs.length){
    L.push("■ サブスク・固定費");
    subs.forEach(x => L.push(`${x.name}  ${x.amount.toLocaleString("ja-JP")}（${x.interval} / 月あたり ${Math.round(Sel.monthlyEquivalent(x)).toLocaleString("ja-JP")}）${x.status === "解約予定" ? " ※解約予定" : ""}`));
    L.push(`月あたり合計 ${Math.round(subs.reduce((a,x)=>a+Sel.monthlyEquivalent(x),0)).toLocaleString("ja-JP")}`);
    L.push("");
  }

  if (includeRows){
    const [from] = monthRange(data[0].monthKey);
    const [,to]  = monthRange(last.monthKey);
    const rows = Store.state.transactions
      .filter(t => t.date >= from && t.date <= to)
      .sort((a,b) => a.date < b.date ? -1 : 1);
    L.push(`■ 明細（${rows.length}件）`);
    rows.forEach(t => L.push(`${t.date}  ${Sel.cat(t.categoryId).name}  ${t.type === "income" ? "-" : ""}${t.amount.toLocaleString("ja-JP")}${t.type === "transfer" ? "（積立）" : ""}  ${Sel.mth(t.methodId).name}  ${t.detail || ""}`.trimEnd()));
    L.push("");
  }
  return L.join("\n");
}

function download(text, filename, mime){
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

  /* ---------------- S5 サブスク展開 ---------------- */
  function s5(){
    g("S5 サブスクの発生日展開");
    const s = seedState();
    withState(s, () => {
      const mk = (o) => Object.assign({ id:"sx", name:"x", amount:100, methodId:null, categoryId:CAT_SUB,
                                        interval:"月次", start:"2026-01-31", end:null, status:"有効",
                                        pauseFrom:null, pauseTo:null }, o||{});
      const dates = a => a.map(x => fmt(x.date));

      const m = Sel.subOccurrences(mk(), parseDate("2026-01-01"), parseDate("2026-04-30"));
      eq("31日開始が2月で丸まり3月で戻る", dates(m), ["2026-01-31","2026-02-28","2026-03-31","2026-04-30"]);

      const w = Sel.subOccurrences(mk({interval:"週次", start:"2026-05-01"}), parseDate("2026-05-01"), parseDate("2026-05-31"));
      eq("週次で5回ある月", dates(w), ["2026-05-01","2026-05-08","2026-05-15","2026-05-22","2026-05-29"]);

      const y = Sel.subOccurrences(mk({interval:"年次", start:"2024-02-29"}), parseDate("2024-01-01"), parseDate("2026-12-31"));
      eq("年次の閏日は翌年28日", dates(y), ["2024-02-29","2025-02-28","2026-02-28"]);

      eq("停止は展開しない",
         Sel.subOccurrences(mk({status:"停止"}), parseDate("2026-01-01"), parseDate("2026-04-30")).length, 0);

      const p = Sel.subOccurrences(mk({ status:"一時停止", pauseFrom:"2026-02-01", pauseTo:"2026-03-31" }),
                                   parseDate("2026-01-01"), parseDate("2026-04-30"));
      eq("一時停止の期間だけ飛ぶ（前後は復活）", dates(p), ["2026-01-31","2026-04-30"]);

      const e = Sel.subOccurrences(mk({ status:"解約予定", end:"2026-03-01" }),
                                   parseDate("2026-01-01"), parseDate("2026-06-30"));
      eq("解約予定は end 以降を出さない", dates(e), ["2026-01-31","2026-02-28"]);

      // 月次の算術版が総当たり参照実装と一致すること
      const ref = (sub, from, to) => {
        const out = []; const st = parseDate(sub.start);
        let y2 = st.getFullYear(), m2 = st.getMonth()+1, gu = 0;
        while (gu++ < 400){
          const d = new Date(y2, m2-1, Math.min(st.getDate(), monthEndDay(y2,m2)));
          if (d > to) break;
          if (d >= from && d >= st) out.push(fmt(d));
          const nm = addMonths(y2,m2,1); y2=nm[0]; m2=nm[1];
        }
        return out;
      };
      let same = true;
      [["2015-03-31","2026-01-01","2026-12-31"],["2026-06-15","2026-01-01","2027-06-30"],
       ["2026-01-01","2026-01-01","2026-01-01"]].forEach(([st,f,t]) => {
        const a = dates(Sel.subOccurrences(mk({start:st}), parseDate(f), parseDate(t)));
        const b = ref(mk({start:st}), parseDate(f), parseDate(t));
        if (JSON.stringify(a) !== JSON.stringify(b)) same = false;
      });
      ok("高速化版が総当たり参照実装と一致", same);
    });
  }

  /* ---------------- S7 移行 ---------------- */
  function s7(){
    g("S7 v1 → v2 移行");
    const v2 = migrate(JSON.parse(JSON.stringify(V1_FIXTURE)));
    eq("取引の件数が保たれる",   v2.transactions.length, V1_FIXTURE.transactions.length);
    eq("サブスクの件数が保たれる", v2.subscriptions.length, V1_FIXTURE.subscriptions.length);
    eq("予算の月キー数が保たれる", Object.keys(v2.budgets).length, Object.keys(V1_FIXTURE.budgets).length);

    ok("取引が孤児にならない（用途・支払方法とも実在）",
       v2.transactions.every(t => byId(v2.categories, t.categoryId) && byId(v2.methods, t.methodId)));

    const orphan = v2.methods.find(m => m.name === "孤児カード");
    ok("pulldownsに無いカードも使える支払方法になる", !!(orphan && orphan.billing && orphan.kind === "card"),
       orphan ? orphan.kind : "なし", "card");
    ok("未知の用途が自動作成される", !!v2.categories.find(c => c.name === "謎用途"));
    ok("未知の支払方法が自動作成される", !!v2.methods.find(m => m.name === "謎のカード"));

    const refund = v2.transactions.find(t => t.id === "c");
    ok("負の金額が refund の正数になる",
       refund && refund.type === "income" && refund.incomeKind === "refund" && refund.amount === 800,
       refund && (refund.type+"/"+refund.incomeKind+"/"+refund.amount), "income/refund/800");
    ok("金額に負の値が残っていない", v2.transactions.every(t => t.amount >= 0));

    const cardA = v2.methods.find(m => m.name === "カードA");
    ok("カードが支払方法に統合される", !!(cardA && cardA.billing && cardA.billing.closeDay === 15),
       cardA && cardA.billing && cardA.billing.closeDay, 15);
    ok("引落口座が紐づく", !!(cardA && cardA.billing.accountId && byId(v2.accounts, cardA.billing.accountId)));

    // 予算の明示的な 0 が保たれているか（ここが落ちると S4 の意味が消える）
    const foodCat = v2.categories.find(c => c.name === "食費");
    const mar = v2.budgets["2026-03"];
    ok("予算の明示的な0が移行後も保たれる",
       mar && Object.prototype.hasOwnProperty.call(mar, foodCat.id) && mar[foodCat.id] === 0,
       mar && mar[foodCat.id], 0);

    // 金額の総和が移行の前後で一致する（符号を揃えて比較）
    const v1Sum = V1_FIXTURE.transactions.reduce((a,t) => a + t.amount, 0);
    const v2Sum = v2.transactions.reduce((a,t) => a + (t.type === "income" ? -t.amount : t.amount), 0);
    eq("金額の総和が移行前後で一致", v2Sum, v1Sum);

    // 冪等性
    const again = migrate(JSON.parse(JSON.stringify(v2)));
    eq("冪等（v2をもう一度通しても変わらない）", again.schemaVersion, v2.schemaVersion);
    eq("冪等（件数も変わらない）", again.transactions.length, v2.transactions.length);

    // v1 の集計を再現し、移行後と突き合わせる
    g("S7b v1 集計との一致");
    const v1Totals = (function(){
      const totals = {}; let grand = 0;
      V1_FIXTURE.pulldowns.categories.forEach(c => totals[c] = 0);
      V1_FIXTURE.transactions.forEach(t => {
        if (!t.date.startsWith("2026-03")) return;
        grand += t.amount;
        if (t.category === "サブスク・固定費") return;
        totals[t.category] = (totals[t.category]||0) + t.amount;
      });
      return { totals, grand };
    })();
    withState(validate(v2).state, () => {
      const r = Sel.monthTotals("2026-03");
      const foodId = Store.state.categories.find(c=>c.name==="食費").id;
      const socId  = Store.state.categories.find(c=>c.name==="交際費").id;
      eq("食費が v1 と一致",   r.totals[foodId], v1Totals.totals["食費"]);
      eq("交際費が v1 と一致（立替精算込み）", r.totals[socId], v1Totals.totals["交際費"]);
      // v1 の grand にはサブスク展開分が加算されていた。その差が展開分と正確に一致するはず。
      const subMar = r.totals[CAT_SUB];
      eq("差はサブスク展開分と未知用途のみ",
         r.expense - v1Totals.grand, subMar + 0 /* 謎用途は v1 の totals には無いが grand には居る */ - 0);
    });
  }

    ok("別アプリのJSONを弾く",         !looksLikeKakeibo({ version:3, items:[], settings:{} }));
    ok("v1形式は受け入れる",            looksLikeKakeibo(V1_FIXTURE));
    ok("v2形式は受け入れる",            looksLikeKakeibo(seedState()));
    ok("記録が空のv2でも受け入れる",    looksLikeKakeibo({ schemaVersion:2, transactions:[], categories:[], methods:[] }));
    ok("移行後のv2も受け入れる",        looksLikeKakeibo(migrate(JSON.parse(JSON.stringify(V1_FIXTURE)))));

  /* ---------------- S10 内訳・推移・ペース ---------------- */
  function s10(){
    g("S10 内訳・推移・ペース");
    const s = seedState();
    const cats = s.categories.filter(c => !c.system);
    // 用途10件に金額を入れて、円グラフが6分割に畳まれることを確認する
    cats.slice(0,10).forEach((c,i) => {
      s.transactions.push({ id:"x"+i, date:"2026-05-10", amount:(10-i)*1000, type:"expense",
        incomeKind:null, categoryId:c.id, methodId:s.methods[0].id, detail:"" });
    });
    withState(s, () => {
      const b = Sel.breakdown("2026-05");
      eq("内訳の行は全件そのまま", b.rows.length, 10);
      eq("円グラフは6分割まで",   b.slices.length, 6);
      eq("最後は「その他」",       b.slices[5].id, "__other");
      // ★ 畳んでも合計は一致する（スライスの和 == 表示合計）
      eq("Σスライス == 支出合計", b.slices.reduce((a,x)=>a+x.value,0), b.total);
      eq("その他は残り5件の合計", b.slices[5].value,
         b.rows.slice(5).reduce((a,x)=>a+x.value,0));
      ok("スライスは降順", b.slices.slice(0,5).every((x,i,a) => i===0 || a[i-1].value >= x.value));

      // 色はカテゴリに固定される（順位で塗り替わらない）
      const topId = b.rows[0].id;
      const slotBefore = b.slices.find(x => x.id === topId).colorSlot;
      eq("色はカテゴリに固定", slotBefore, Sel.cat(topId).colorSlot);
    });

    // 推移
    const t = seedState();
    const c0 = t.categories[0].id, m0 = t.methods[0].id;
    t.transactions.push(
      { id:"a", date:"2026-04-01", amount:5000,  type:"expense", incomeKind:null,      categoryId:c0, methodId:m0, detail:"" },
      { id:"b", date:"2026-05-01", amount:3000,  type:"expense", incomeKind:null,      categoryId:c0, methodId:m0, detail:"" },
      { id:"c", date:"2026-05-02", amount:20000, type:"income",  incomeKind:"earning", categoryId:c0, methodId:m0, detail:"" }
    );
    withState(t, () => {
      const d = Sel.trend("2026-05", 3);
      eq("直近3ヶ月ぶん返る", d.length, 3);
      eq("並びは古い順", d.map(x=>x.monthKey), ["2026-03","2026-04","2026-05"]);
      eq("4月の支出", d[1].expense, 5000);
      eq("5月の支出", d[2].expense, 3000);
      eq("5月の収入", d[2].income, 20000);
      eq("5月の収支", d[2].net, 17000);
      eq("記録の無い月は0", d[0].expense, 0);
    });

    // ペース
    const p = seedState();
    const pc = p.categories[0].id;
    p.budgets = { "2026-05": { [pc]: 30000 } };
    p.transactions.push({ id:"p1", date:"2026-05-05", amount:9000, type:"expense",
      incomeKind:null, categoryId:pc, methodId:p.methods[0].id, detail:"" });
    withState(p, () => {
      const r = Sel.pace("2026-05");
      eq("予算合計", r.budget, 30000);
      eq("残り", r.remain, 21000);
      eq("過去の月は月末まで経過扱い", r.elapsed, 31);
      eq("過去の月の残り日数は0", r.left, 0);
      eq("1日平均 = 9000/31", Math.round(r.perDaySoFar), Math.round(9000/31));
    });

    // 予算未設定なら remain は null（0 と区別する）
    withState(seedState(), () => {
      eq("予算未設定なら remain は null", Sel.pace("2026-05").remain, null);
    });

    // 用途がマイナスになる場合（立替精算が使った額を上回る）。
    // v1では入金を負の金額で記録していたので、給与を負で入れていた人は必ずこうなる。
    g("S10c 用途がマイナスの月");
    const neg = seedState();
    const nc = neg.categories[0].id, nc2 = neg.categories[1].id, nm = neg.methods[0].id;
    neg.transactions.push(
      { id:"n1", date:"2026-05-01", amount:2000,   type:"expense", incomeKind:null,     categoryId:nc,  methodId:nm, detail:"" },
      { id:"n2", date:"2026-05-02", amount:260000, type:"income",  incomeKind:"refund", categoryId:nc,  methodId:nm, detail:"給与を負で記録していた分" },
      { id:"n3", date:"2026-05-03", amount:8000,   type:"expense", incomeKind:null,     categoryId:nc2, methodId:nm, detail:"" }
    );
    withState(neg, () => {
      const b = Sel.breakdown("2026-05");
      eq("マイナスの用途はスライスから外れる", b.slices.map(x=>x.id), [nc2]);
      eq("マイナスの用途は negatives に入る",  b.negatives.map(x=>x.id), [nc]);
      // ★ 不変条件: 円の中央の数字はスライスの和と必ず一致する
      eq("Σスライス == ドーナツ中央の合計", b.slices.reduce((a,x)=>a+x.value,0), b.total);
      eq("ドーナツの合計は正の分だけ", b.total, 8000);
      eq("実際の支出は差し引き後", b.expense, 2000 - 260000 + 8000);
      ok("合計と実支出が違うことを呼び出し側が判別できる", b.total !== b.expense);

      // グラフが落ちないこと
      const svg = toHTML(Chart.donut(b.slices, b.total));
      ok("マイナス月でもドーナツが描ける", svg.indexOf("<svg") > -1);
      ok("マイナスの扇は描かれない", (svg.match(/class="seg"/g)||[]).length === 1);
      const tr = toHTML(Chart.trend(Sel.trend("2026-05", 3)));
      ok("マイナス月でも推移グラフが描ける", tr.indexOf("<svg") > -1);
      ok("負の高さの棒が出ない", tr.indexOf("NaN") === -1 && tr.indexOf("e-") === -1);
    });

    g("S10b グラフの描画");
    withState(s, () => {
      const b = Sel.breakdown("2026-05");
      const svg = toHTML(Chart.donut(b.slices, b.total));
      eq("スライス数ぶんの円弧が出る", (svg.match(/class="seg"/g)||[]).length, 6);
      ok("合計がドーナツ中央に出る", svg.indexOf(yen(b.total)) > -1);
      ok("各スライスに読み上げ用のtitleがある", (svg.match(/<title>/g)||[]).length === 6);
      ok("色は系列トークンを参照する", svg.indexOf("var(--s") > -1);
      const empty = toHTML(Chart.donut([], 0));
      ok("データ0件でも壊れない", empty.indexOf("記録なし") > -1);
      const tr = toHTML(Chart.trend(Sel.trend("2026-05", 12)));
      ok("推移グラフが描ける", tr.indexOf("<svg") === 0 || tr.indexOf("<svg") > -1);
      ok("目盛り線は実線（点線を使わない）", tr.indexOf("stroke-dasharray") === -1 || tr.indexOf("grid-line") > -1);
    });
  }

  /* ---------------- S11 支払予定・サブスクの状態 ---------------- */
  function s11(){
    g("S11 支払予定");
    const s = seedState();
    const acc = { id:"acc1", name:"口座A", balance:null, balanceAsOf:null, order:0, archived:false };
    s.accounts.push(acc);
    // 15日締め・翌月10日払い
    const card = s.methods.find(m => m.kind === "card");
    card.billing = { accountId:acc.id, closeType:"毎月指定日", closeDay:15, payOffset:1,
                     payDayType:"date", payDay:10, holidayAdjust:"調整なし" };
    const cash = s.methods.find(m => m.kind === "cash");
    const cat = s.categories[0].id;
    const now = new Date();
    const mk = monthKeyOf(now.getFullYear(), now.getMonth()+1);
    s.transactions.push(
      // 締め日の前後で請求サイクルが分かれること
      { id:"p1", date:mk+"-10", amount:1000, type:"expense", incomeKind:null, categoryId:cat, methodId:card.id, detail:"締め前" },
      { id:"p2", date:mk+"-20", amount:2000, type:"expense", incomeKind:null, categoryId:cat, methodId:card.id, detail:"締め後" },
      // 立替精算はその請求から差し引かれる
      { id:"p3", date:mk+"-11", amount:300,  type:"income",  incomeKind:"refund", categoryId:cat, methodId:card.id, detail:"返金" },
      // 別の支払方法のものは混ざらない
      { id:"p4", date:mk+"-12", amount:9999, type:"expense", incomeKind:null, categoryId:cat, methodId:cash.id, detail:"現金" }
    );
    withState(s, () => {
      const sc = Sel.cardSchedule(card.id);
      ok("カードの予定が返る", !!sc);
      eq("引落口座が紐づく", sc.account && sc.account.name, "口座A");

      const [y,m] = mk.split("-").map(Number);
      const [ny,nm] = addMonths(y,m,1);
      const g1 = sc.groups.find(x => x.payDate === monthKeyOf(ny,nm) + "-10");
      const [n2y,n2m] = addMonths(y,m,2);
      const g2 = sc.groups.find(x => x.payDate === monthKeyOf(n2y,n2m) + "-10");

      ok("締め日前の分は翌月10日払い", !!g1);
      ok("締め日後の分は翌々月10日払い", !!g2);
      eq("翌月分は返金が差し引かれる", g1 && g1.total, 1000 - 300);
      eq("翌々月分", g2 && g2.total, 2000);
      ok("別の支払方法は混ざらない",
         sc.groups.every(x => x.items.every(it => it.methodId === card.id)));
      ok("グループは支払日の昇順",
         sc.groups.every((x,i,a) => i === 0 || a[i-1].payDate <= x.payDate));
      eq("カードでない支払方法は予定なし", Sel.cardSchedule(cash.id), null);
    });

    // 休日調整のフラグが立つこと
    const h = seedState();
    const hc = h.methods.find(m => m.kind === "card");
    hc.billing = { accountId:null, closeType:"毎月指定日", closeDay:15, payOffset:1,
                   payDayType:"date", payDay:10, holidayAdjust:"翌営業日" };
    h.holidays = { "2026-08-10":{name:"テスト祝日",source:"manual"} };
    withState(h, () => {
      const r = Sel.scheduleFor(hc.id, "2026-07-10");
      eq("本来の支払日", fmt(r.rawPayDate), "2026-08-10");
      ok("祝日なのでずれる", r.adjusted);
      ok("ずれた先は営業日", Sel.isBusinessDay(r.payDate));
    });

    g("S11b サブスクの4状態と月次換算");
    withState(seedState(), () => {
      const base = { id:"s", name:"x", amount:1200, methodId:null, categoryId:CAT_SUB,
                     start:"2026-01-01", end:null, status:"有効", pauseFrom:null, pauseTo:null };
      eq("月次はそのまま",       Math.round(Sel.monthlyEquivalent(Object.assign({}, base, {interval:"月次"}))), 1200);
      eq("週次は52/12倍",        Math.round(Sel.monthlyEquivalent(Object.assign({}, base, {interval:"週次"}))), Math.round(1200*52/12));
      eq("年次は12分の1",        Math.round(Sel.monthlyEquivalent(Object.assign({}, base, {interval:"年次"}))), 100);
      eq("停止は0",              Sel.monthlyEquivalent(Object.assign({}, base, {interval:"月次", status:"停止"})), 0);
      // v1は月次だけを単純合計していたので、週次・年次が合計から漏れていた
      ok("週次が合計から漏れない", Sel.monthlyEquivalent(Object.assign({}, base, {interval:"週次"})) > 0);
    });

    g("S11c 締め日設定の説明文");
    eq("15日締め・翌月27日払い",
       Sel.billingText({closeType:"毎月指定日", closeDay:15, payOffset:1, payDayType:"date", payDay:27}),
       "15日締め ／ 翌月27日払い");
    eq("月末締め・翌々月末日払い",
       Sel.billingText({closeType:"月末", payOffset:2, payDayType:"末日"}),
       "月末締め ／ 翌々月末日払い");
    eq("当月払い",
       Sel.billingText({closeType:"毎月指定日", closeDay:5, payOffset:0, payDayType:"date", payDay:25}),
       "5日締め ／ 当月25日払い");
  }

      const full = buildAnalysisText(3, true);
      ok("明示的に選べば明細が入る", full.indexOf("■ 明細") > -1);

  function run(){
    const before = localStorage.getItem(KEY_STATE);
    rs.length = 0;
    [s1,s2,s3,s4,s5,s6,s7,s8,s9,s10,s11,s12,s13,s14].forEach(f => {
      try { f(); } catch(e){ ok("💥 スイートが例外で停止: " + e.message, false, String(e && e.stack || e), "throw なし"); }
    });
    const after = localStorage.getItem(KEY_STATE);
    group = "S0 安全性";
    ok("自己テストが localStorage を変更していない", before === after);
    report();
  }

  function report(){
    const fail = rs.filter(r => !r.pass);
    const el = document.createElement("div");
    el.id = "selftest";
    const groups = [];
    rs.forEach(r => { let gg = groups.find(x=>x.name===r.group); if(!gg){ gg={name:r.group, items:[]}; groups.push(gg);} gg.items.push(r); });
    // 失敗を先頭に
    groups.forEach(gg => gg.items.sort((a,b)=> (a.pass?1:0)-(b.pass?1:0)));
    groups.sort((a,b)=> (a.items.some(i=>!i.pass)?0:1) - (b.items.some(i=>!i.pass)?0:1));

    el.innerHTML = toHTML(html`
      <h1>🧪 自己テスト結果</h1>
      <div class="sum ${fail.length ? "ng" : "ok"}">${rs.length - fail.length} passed / ${fail.length} failed（全 ${rs.length} 件）</div>
      <div class="btn-row" style="margin-bottom:8px">
        <button class="btn small" onclick="location.search=''">アプリに戻る</button>
      </div>
      ${groups.map(gg => html`
        <div class="g">${gg.name}</div>
        ${gg.items.map(r => html`
          <div class="c ${r.pass ? "" : "f"}">
            <span class="st">${r.pass ? "✅" : "❌"}</span>
            <span class="nm">${r.name}
              ${r.pass ? "" : html`<div class="gw">got : ${JSON.stringify(r.got)}\nwant: ${JSON.stringify(r.want)}</div>`}
            </span>
          </div>`)}
      `)}
    `);
    document.body.appendChild(el);
    try { console.table(rs.map(r => ({ group:r.group, name:r.name, pass:r.pass }))); } catch(e){}
    window.__selftest = { pass: rs.length - fail.length, fail: fail.length, cases: rs };
  }

  return { run };
})();

}

/* ====================================================================
   §11 PWA — オフラインで使えるようにする
   ==================================================================== */
function registerServiceWorker(){
  // v2.html のうちは登録しない。スコープが ./ なので、v2.html を
  // アプリ本体としてキャッシュしてしまう
  const IS_PRIMARY = /\/(index\.html)?$/.test(location.pathname);
  if (!IS_PRIMARY) return;
  if (!("serviceWorker" in navigator)) return;
  // https か localhost のときだけ。file:// では登録できない
  const secure = location.protocol === "https:"
              || ["localhost","127.0.0.1"].includes(location.hostname);
  if (!secure) return;

  window.addEventListener("load", async () => {
    try{
      // Pages は sw.js にもキャッシュ指示を返すので、これが無いと
      // 最大10分ぶん古い sw.js を見続ける
      const reg = await navigator.serviceWorker.register("./sw.js", { updateViaCache:"none" });

      const notify = () => Toast.show("新しいバージョンがあります", {
        actionLabel:"更新", ms:0,
        onAction(){ if (reg.waiting) reg.waiting.postMessage("SKIP_WAITING"); },
      });
      if (reg.waiting) notify();
      reg.addEventListener("updatefound", () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener("statechange", () => {
          if (sw.state === "installed" && navigator.serviceWorker.controller) notify();
        });
      });

      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloaded) return;
        reloaded = true;
        location.reload();
      });

      setInterval(() => reg.update(), 60*60*1000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update(); });

      // ローカルにしかデータが無いので、勝手に消されないよう頼んでおく。
      // これは利便性ではなく、データを失わないための処置
      if (navigator.storage && navigator.storage.persist){
        const already = navigator.storage.persisted ? await navigator.storage.persisted() : false;
        if (!already) navigator.storage.persist().catch(() => {});
      }
    }catch(e){
      console.warn("[sw]", e);   // 登録に失敗してもアプリは普通に動く
    }
  });
}

/* バックアップの読み込み。壊れたファイルで家計簿が消えないよう、
   検証 → スナップショット → 差し替え → 報告（取り消し付き）の順で進める。 */
document.addEventListener("change", e => {
  if (e.target.id !== "io-import") return;
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    const snapshot = JSON.parse(JSON.stringify(Store.state));
    try{
      const parsed = JSON.parse(reader.result);
      // 先に「このアプリのデータか」を確かめる。これをしないと無関係なJSONが
      // 空の状態に化けて、既存の家計簿を消してしまう
      if (!looksLikeKakeibo(parsed)) throw new Error("この家計簿のバックアップファイルではないようです");
      // 移行チェーンを通すので、v1形式の古いバックアップもそのまま読める
      const r = validate(migrate(parsed));

      // 中身のあるデータを空で置き換えようとしたら、一度確認する
      const had = snapshot.transactions.length;
      const will = r.state.transactions.length;
      if (had > 0 && will === 0 &&
          !confirm(`今ある ${had} 件の記録が、0件のファイルで置き換えられます。よろしいですか？`)){
        throw new Error("読み込みを中止しました");
      }
      try { localStorage.setItem(KEY_UNDO, JSON.stringify(snapshot)); } catch(err){}
      Store.replace(r.state);
      View.settings();

      const bits = [r.state.transactions.length + "件の記録"];
      if (r.repaired.length) bits.push("修復 " + r.repaired.length + "件");
      if (r.errors.length)   bits.push("読めなかった行 " + r.errors.length + "件");
      Toast.show("読み込みました（" + bits.join(" / ") + "）", {
        actionLabel:"元に戻す", ms:12000,
        onAction(){ Store.replace(snapshot); View.settings(); Toast.show("元に戻しました"); },
      });
    }catch(err){
      Store.replace(snapshot);          // 何も変えずに戻す
      Toast.show("読み込めませんでした: " + (err && err.message || err), {kind:"err", ms:0});
    }
  };
  reader.onerror = () => Toast.show("ファイルを読めませんでした", {kind:"err"});
  reader.readAsText(file);
});

/* パソコンで使うときは、テンキーを押さなくてもキーボードで金額を打てるようにする。
   メモや日付を編集している間は横取りしない。 */
document.addEventListener("keydown", e => {
  const sheet = $("#sheet-entry");
  if (!sheet || !sheet.open) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  const el = document.activeElement;
  const typing = el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);

  if (e.key === "Enter"){
    if (typing && el.type !== "date") el.blur();   // メモ入力中の Enter は確定だけ
    e.preventDefault();
    Actions["entry:save"]();
    return;
  }
  if (typing) return;                               // 以下は入力欄の外にいるときだけ

  if (/^[0-9]$/.test(e.key)){ e.preventDefault(); Entry.key(e.key); return; }
  if (e.key === "+"){ e.preventDefault(); Entry.key("+"); return; }
  if (e.key === "-"){ e.preventDefault(); Entry.key("-"); return; }
  if (e.key === "Backspace"){ e.preventDefault(); Entry.key("back"); return; }
  if (e.key === "Delete" || e.key === "c" || e.key === "C"){ e.preventDefault(); Entry.key("clear"); return; }
});

})();

          ${String(err && err.message || err)}<br><br>
          データはこの端末のブラウザ内にあります。下のボタンで中身を取り出せます。
          旧バージョンのアプリ（index.html）はそのまま使えます。
        </p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
          <button id="rec-export" style="padding:11px 16px;border:0;border-radius:11px;background:#1F5F55;color:#fff;font-weight:800">生データを書き出す</button>
          <a href="./index.html" style="padding:11px 16px;border-radius:11px;background:#EEECE6;color:#26302C;font-weight:800;text-decoration:none">旧バージョンを開く</a>
        </div>
      </div>`);
    const b = document.getElementById("rec-export");
    if (b) b.addEventListener("click", () => {
      const dump = { state: localStorage.getItem(KEY_STATE), v1: localStorage.getItem(KEY_V1) };
      download(JSON.stringify(dump, null, 2), "家計簿_生データ.json", "application/json");
    });
  }
}

window.KB = { Store, Sel, Actions, Test, migrate, validate, looksLikeKakeibo, seedState, buildAnalysisText, version: APP_VERSION };

})();
</script>
