<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0B2447" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<!-- iOS の「ホーム画面に追加」は manifest の icons を見ず、これだけを見る。
     しかもラスタPNGしか受け付けない。無いとページの画像が勝手に使われる -->
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<title>家計簿</title>

<!-- テーマを描画前に当てる（チラつき防止） -->
<script>
try{
  var p = JSON.parse(localStorage.getItem('kakeibo_state')||'{}').prefs;
  if(p && p.theme && p.theme!=='auto') document.documentElement.dataset.theme = p.theme;
}catch(e){}
</script>

<style>
@layer tokens, base, layout, components, views, utils;

/* ===================================================================
   §T tokens
   =================================================================== */
@layer tokens {
  :root{
    /* 配色は「明細」方向: 濃紺＋ブルー。彩度を抑えて金額を主役にする */
    --accent-deep:#0B2447; --accent:#1057C8; --accent-soft:#E6EEFB;
    --warn:#B07615;      --warn-soft:#FAF0D9;
    --paper:#F5F7FB;     --surface:#FFFFFF;  --surface-2:#EFF3F9;
    --ink:#0F1B2D;       --ink-soft:#54657F; --ink-faint:#8896AB;
    --line:#E1E8F0;
    --red:#C8372D;       --red-soft:#FBE9E7;
    --shadow-sm: 0 1px 2px rgba(11,36,71,.05);
    --shadow:    0 6px 20px rgba(11,36,71,.08), 0 1px 2px rgba(11,36,71,.05);
    --shadow-lg: 0 18px 44px rgba(11,36,71,.18);
    --ease-spring: cubic-bezier(.22,1,.36,1);
    --ease-out:    cubic-bezier(.16,1,.3,1);
    --tap:44px;
    --bar-h:58px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --rail-w:216px;

    /* グラフ用の系列色。8スロット固定で、順番に意味がある（隣り合う色が
       色覚特性でも見分けられる並びとして検証済み。勝手に並べ替えないこと）。
       9個目は作らず「その他」にまとめる。 */
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
    --grid:#E7EDF5;            /* 目盛りは面から1段だけずらす */
  }
  /* ダークは単純反転にしない: 暗い面では影が情報を持たないのでヘアラインに置き換え、
     背景は純黒でなく青みの暗色にして、その上のカードが浮いて見えるようにする */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --accent-deep:#071020; --accent:#5B96F5; --accent-soft:#152743;
      --warn:#D9A94F;      --warn-soft:#2A2315;
      --paper:#0A1220;     --surface:#121C2E; --surface-2:#1A2639;
      --ink:#E8EEF7;       --ink-soft:#94A6BE; --ink-faint:#6A7B92;
      --line:#21304A;
      --red:#E4796C;       --red-soft:#331F1D;
      --shadow-sm: 0 0 0 1px rgba(255,255,255,.04);
      --shadow:    0 0 0 1px rgba(255,255,255,.05);
      --shadow-lg: 0 12px 32px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06);
      /* ダークは反転ではなく、暗い面用に選び直した同じ8色 */
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
      --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
      --grid:#21304A;
    }
  }
  :root[data-theme="dark"]{
    --accent-deep:#071020; --accent:#5B96F5; --accent-soft:#152743;
    --warn:#D9A94F;      --warn-soft:#2A2315;
    --paper:#0A1220;     --surface:#121C2E; --surface-2:#1A2639;
    --ink:#E8EEF7;       --ink-soft:#94A6BE; --ink-faint:#6A7B92;
    --line:#21304A;
    --red:#E4796C;       --red-soft:#331F1D;
    --shadow-sm: 0 0 0 1px rgba(255,255,255,.04);
    --shadow:    0 0 0 1px rgba(255,255,255,.05);
    --shadow-lg: 0 12px 32px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --grid:#21304A;
  }
}

/* ===================================================================
   §B base
   =================================================================== */
@layer base {
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Segoe UI",sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.5;
    -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
    padding-bottom:calc(var(--bar-h) + var(--safe-b) + 12px);
    overscroll-behavior-y:none;
  }
  h1,h2,h3{ letter-spacing:-0.015em; margin:0; }
  button{ font-family:inherit; }
  [hidden]{ display:none !important; }
  .num{ font-variant-numeric:tabular-nums; }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
  @media (prefers-contrast: more){
    :root{ --line:#9AA8A2; --ink-soft:#3A4742; }
  }
}

/* ===================================================================
   §L layout
   =================================================================== */
@layer layout {
  header.appbar{
    position:sticky; top:0; z-index:40;
    background:linear-gradient(135deg,var(--accent-deep),var(--accent));
    color:#fff; padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
    box-shadow:var(--shadow-sm);
    display:flex; align-items:center; gap:10px;
  }
  header.appbar .title{ font-size:17px; font-weight:800; letter-spacing:-0.01em; }
  header.appbar .sub{ font-size:11px; opacity:.8; margin-top:2px; }
  header.appbar .spacer{ flex:1; }
  header.appbar .icon-btn{
    appearance:none; border:none; background:rgba(255,255,255,.16); color:#fff;
    width:34px; height:34px; border-radius:50%; font-size:15px; cursor:pointer;
    display:grid; place-items:center;
    transition:background-color .18s var(--ease-out), transform .1s var(--ease-out);
  }
  header.appbar .icon-btn:active{ transform:scale(.9); }

  main{ max-width:720px; margin:0 auto; padding:12px 14px 0; container-type:inline-size; }

  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:45;
    height:calc(var(--bar-h) + var(--safe-b));
    padding-bottom:var(--safe-b);
    display:grid; grid-template-columns:repeat(5,1fr); align-items:center;
    background:color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-top:1px solid var(--line);
  }
  nav.tabbar button{
    appearance:none; border:none; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    min-height:var(--tap); color:var(--ink-faint); font-size:10px; font-weight:700;
    padding:0; transition:color .18s var(--ease-out);
  }
  nav.tabbar button .ic{ font-size:19px; line-height:1; }
  nav.tabbar button[aria-current="page"]{ color:var(--accent); }
  nav.tabbar button:active .ic{ transform:scale(.88); }
  nav.tabbar .fab-slot{ position:relative; }
  nav.tabbar .fab{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-58%);
    width:54px; height:54px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent-deep)); color:#fff;
    font-size:26px; font-weight:300; line-height:1;
    box-shadow:0 6px 18px rgba(46,139,122,.42);
    display:grid; place-items:center;
    transition:transform .14s var(--ease-spring);
  }
  nav.tabbar .fab:active{ transform:translate(-50%,-58%) scale(.9); }

  /* ===== PC（900px以上）: 下部タブを左サイドバーに、本文は2カラムに ===== */
  @media (min-width: 900px){
    body{ padding-bottom:0; padding-left:var(--rail-w); }
    header.appbar{ padding-left:calc(var(--rail-w) + 20px); }

    nav.tabbar{
      top:0; bottom:0; right:auto; width:var(--rail-w); height:100dvh;
      display:flex; flex-direction:column; align-items:stretch; gap:4px;
      padding:calc(env(safe-area-inset-top,0px) + 74px) 12px 16px;
      border-top:0; border-right:1px solid var(--line);
      background:var(--surface);
    }
    nav.tabbar button{
      flex-direction:row; justify-content:flex-start; gap:11px;
      padding:0 14px; height:44px; border-radius:11px; font-size:13.5px;
    }
    nav.tabbar button .ic{ font-size:17px; }
    nav.tabbar button:hover{ background:var(--surface-2); }
    nav.tabbar button[aria-current="page"]{ background:var(--accent-soft); color:var(--accent); }
    /* FABはサイドバー先頭の通常ボタンに変える */
    nav.tabbar .fab-slot{ order:-1; height:48px; margin-bottom:6px; }
    nav.tabbar .fab{
      position:static; transform:none; width:100%; height:48px;
      border-radius:13px; font-size:15px; font-weight:800; gap:8px;
      box-shadow:var(--shadow-sm);
    }
    nav.tabbar .fab::after{ content:"記録する"; font-size:14px; }
    nav.tabbar .fab:active{ transform:scale(.98); }

    main{ max-width:1040px; padding:18px 24px 40px; }
    /* 2カラムにできる画面は横に並べる */
    .cols{ display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start; }
    .cols > .span2{ grid-column:1 / -1; }
    .donut-wrap{ flex-direction:row; align-items:center; gap:24px; }
    .donut{ width:220px; height:220px; }
    #toasts{ bottom:20px; left:calc(50% + var(--rail-w)/2); }
    dialog.sheet{ margin:auto; border-radius:20px; max-height:88dvh; }
    dialog.sheet .sheet-in{ padding-bottom:18px; }
  }
  /* 大画面では3カラムまで */
  @media (min-width: 1280px){
    main{ max-width:1240px; }
    .cols.c3{ grid-template-columns:repeat(3,1fr); }
  }
}

/* ===================================================================
   §C components
   =================================================================== */
@layer components {
  .panel{
    background:var(--surface); border:1px solid transparent; border-radius:16px;
    padding:16px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .panel > h2{ font-size:14px; color:var(--ink); font-weight:800; margin-bottom:4px; }
  .note{ font-size:11.5px; color:var(--ink-soft); line-height:1.6; margin:0 0 10px; }

  /* 幅が足りなければ自動で1列に落ちる。コンテナクエリに頼らないのは、
     入力シートが <dialog> で main の外にあり、あちらの @container が効かないため。
     日付入力は最小幅を持つので、min-width:0 を付けないと縮めず隣にはみ出す。 */
  .grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; }
  .grid > *{ min-width:0; }

  label.field{ display:flex; flex-direction:column; gap:5px; font-size:11.5px; color:var(--ink-soft); font-weight:700; min-width:0; }
  input,select,textarea{
    font-family:inherit; font-size:15px; padding:10px 11px; border:1px solid var(--line);
    border-radius:11px; background:var(--surface); color:var(--ink); width:100%; min-width:0;
    transition:border-color .18s var(--ease-out), box-shadow .18s var(--ease-out);
  }
  input:focus,select:focus,textarea:focus{
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3.5px color-mix(in srgb, var(--accent) 20%, transparent);
  }

  .btn{
    appearance:none; border:none; border-radius:12px; padding:11px 17px; font-size:13.5px;
    font-weight:800; cursor:pointer; background:var(--accent-deep); color:#fff; min-height:var(--tap);
    transition:filter .18s var(--ease-out), transform .1s var(--ease-out);
  }
  .btn:active{ transform:scale(.97); filter:brightness(.95); }
  .btn.primary{ background:var(--accent); }
  .btn.gold{ background:var(--warn); color:#3a2e10; }
  .btn.outline{ background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .btn.ghost{ background:var(--surface-2); color:var(--ink); }
  .btn.danger{ background:var(--red); }
  .btn.small{ padding:7px 12px; font-size:12px; border-radius:9px; min-height:36px; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .btn[disabled]{ opacity:.45; pointer-events:none; }

  .chip-row{ display:flex; gap:7px; overflow-x:auto; padding:3px 1px 7px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    appearance:none; flex:0 0 auto; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); border-radius:20px; padding:8px 13px; font-size:12.5px; font-weight:700;
    cursor:pointer; white-space:nowrap; min-height:36px;
    transition:background-color .16s var(--ease-out), border-color .16s var(--ease-out), transform .1s var(--ease-out);
  }
  .chip:active{ transform:scale(.94); }
  .chip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
  .chip.add{ border-style:dashed; color:var(--accent); font-weight:800; }

  .tag{ display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px;
        background:var(--accent-soft); color:var(--accent); }
  .tag.gold{ background:var(--warn-soft); color:var(--warn); }
  .tag.red{ background:var(--red-soft); color:var(--red); }
  .tag.gray{ background:var(--surface-2); color:var(--ink-soft); }

  .seg{ display:flex; background:var(--surface-2); border-radius:12px; padding:3px; gap:3px; }
  .seg button{
    flex:1; appearance:none; border:none; background:transparent; color:var(--ink-soft);
    border-radius:9px; padding:9px 6px; font-size:12.5px; font-weight:800; cursor:pointer; min-height:40px;
    transition:background-color .18s var(--ease-out), color .18s var(--ease-out);
  }
  .seg button[aria-pressed="true"]{ background:var(--surface); color:var(--accent); box-shadow:var(--shadow-sm); }

  /* --- リスト行 --- */
  .rows{ display:flex; flex-direction:column; }
  .day-head{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:12px 2px 6px; font-size:11.5px; font-weight:800; color:var(--ink-soft);
    border-bottom:1px solid var(--line);
  }
  .row{
    display:flex; align-items:center; gap:10px; padding:11px 2px;
    border-bottom:1px solid var(--line); cursor:pointer; background:transparent;
    border-left:0; border-right:0; border-top:0; width:100%; text-align:left; color:inherit;
    content-visibility:auto; contain-intrinsic-size:auto 52px;
  }
  .row:active{ background:var(--surface-2); }
  .row .swatch{ width:9px; height:34px; border-radius:5px; flex:0 0 auto; background:var(--ink-faint); }
  .row .main{ flex:1; min-width:0; }
  .row .l1{ font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .l2{ font-size:11px; color:var(--ink-soft); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .amt{ font-size:14.5px; font-weight:800; flex:0 0 auto; }
  .row .amt.in{ color:var(--accent); }

  .empty{ text-align:center; padding:34px 16px; color:var(--ink-faint); font-size:12.5px; line-height:1.9; }
  .empty .big{ font-size:34px; display:block; margin-bottom:8px; }

  .total-box{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:12px; padding:13px 15px; border-radius:13px;
    background:var(--accent-soft); color:var(--accent);
  }
  .total-box .lbl{ font-size:12px; font-weight:700; }
  .total-box .val{ font-size:19px; font-weight:800; }

  /* --- 収支サマリー: 明細のように行で積み、収支をいちばん大きく出す --- */
  .sum3{ display:flex; flex-direction:column; }
  .sum3 > div{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    padding:11px 2px; border-bottom:1px solid var(--line);
  }
  .sum3 > div:last-child{ border-bottom:0; padding-bottom:2px; }
  .sum3 .k{ font-size:12px; color:var(--ink-soft); font-weight:700; }
  .sum3 .v{ font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.015em; }
  /* 収支だけは見出し数字なので、等幅をやめて自然な字送りにする */
  .sum3 > div:last-child .v{ font-size:30px; font-variant-numeric:normal; letter-spacing:-.025em; }
  .sum3 .v.ex{ color:var(--red); } .sum3 .v.in{ color:var(--accent); }
  .sum3 .v.sv{ color:var(--s7); }
  .sum3 .sub-k{ display:block; font-size:10.5px; font-weight:600; color:var(--ink-faint); margin-top:2px; }
  .row .amt.sv, .amount-display .val.sv{ color:var(--s7); }
  /* 種別が4つになると窮屈なので、狭い画面では文字を詰める */
  .seg4 button{ padding:9px 2px; font-size:11.5px; }
  @media (min-width: 420px){ .seg4 button{ font-size:12.5px; padding:9px 6px; } }

  /* 金額は桁を縦に揃える */
  .legend-row .vl, .legend-row .pc, .row .amt, .bud-bot, .bud-top input,
  .total-box .val, .day-head span, .pace .v{ font-variant-numeric:tabular-nums; }

  /* --- シート --- */
  dialog.sheet{
    margin:auto auto 0; width:min(560px,100%); max-height:92dvh;
    border:0; padding:0; background:var(--surface); color:var(--ink);
    border-radius:22px 22px 0 0; box-shadow:var(--shadow-lg);
    overflow:visible;
  }
  dialog.sheet::backdrop{ background:rgba(0,0,0,.4); backdrop-filter:blur(2px); }
  dialog.sheet .sheet-in{ padding:8px 16px calc(16px + var(--safe-b)); max-height:92dvh; overflow-y:auto; }
  /* 入力シートは、テンキーを下に固定して、それ以外を上でスクロールさせる。
     金額の表示だけはテンキーのすぐ上に置く（打っている数字が見えないと困るため）。 */
  dialog.sheet .sheet-in.split{ display:flex; flex-direction:column; padding:8px 0 0; overflow:hidden; }
  dialog.sheet .sheet-in.split > .grabber,
  dialog.sheet .sheet-in.split > .sheet-head{ flex:0 0 auto; margin-left:16px; margin-right:16px; }
  dialog.sheet .sheet-scroll{ flex:1 1 auto; min-height:0; overflow-y:auto; padding:0 16px 14px;
                              -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  dialog.sheet .sheet-foot{
    flex:0 0 auto; padding:10px 16px calc(12px + var(--safe-b));
    border-top:1px solid var(--line); background:var(--surface);
  }
  dialog.sheet .grabber{ width:38px; height:4px; border-radius:3px; background:var(--line); margin:8px auto 10px; }
  dialog.sheet .sheet-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  dialog.sheet .sheet-head h2{ font-size:15px; font-weight:800; flex:1; }
  @media (prefers-reduced-motion: no-preference){
    dialog.sheet{ transition:transform .3s var(--ease-spring), overlay .3s allow-discrete, display .3s allow-discrete; transform:translateY(100%); }
    dialog.sheet[open]{ transform:translateY(0); }
    @starting-style{ dialog.sheet[open]{ transform:translateY(100%); } }
  }

  /* --- テンキー --- */
  .amount-display{
    text-align:right; padding:10px 14px 8px; border-radius:14px; background:var(--surface-2);
    margin-bottom:10px;
  }
  .amount-display .expr{ font-size:12px; color:var(--ink-soft); min-height:17px; }
  /* 物理キーボードのある画面でだけ案内を出す */
  .kbd-hint{ display:none; color:var(--ink-faint); font-size:11px; }
  @media (hover: hover) and (pointer: fine){ .kbd-hint{ display:inline; } }
  .amount-display .val{ font-size:30px; font-weight:800; letter-spacing:-.02em; line-height:1.2; }
  .amount-display .val.in{ color:var(--accent); }
  .keypad{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
  .keypad button{
    appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:13px; font-size:20px; font-weight:700; cursor:pointer;
    min-height:52px; transition:background-color .12s var(--ease-out), transform .08s var(--ease-out);
  }
  .keypad button:active{ transform:scale(.94); background:var(--surface-2); }
  .keypad button.op{ background:var(--surface-2); font-size:19px; color:var(--accent); }
  .keypad button.save{ background:var(--accent); color:#fff; border-color:var(--accent); font-size:15px; font-weight:800; grid-row:span 2; }
  .keypad button.wide{ grid-column:span 2; }

  /* --- トースト --- */
  #toasts{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(var(--bar-h) + var(--safe-b) + 12px); z-index:90;
    display:flex; flex-direction:column; gap:8px; width:min(520px, calc(100% - 28px));
    pointer-events:none;
  }
  .toast{
    pointer-events:auto; background:var(--ink); color:var(--paper);
    border-radius:13px; padding:12px 14px; font-size:13px; font-weight:700;
    box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:12px;
    animation:toastIn .28s var(--ease-spring);
  }
  .toast .msg{ flex:1; }
  .toast button{
    appearance:none; border:none; background:transparent; color:var(--accent);
    font-size:13px; font-weight:800; cursor:pointer; padding:4px 2px; white-space:nowrap;
  }
  .toast.err{ background:var(--red); color:#fff; }
  .toast.err button{ color:#fff; text-decoration:underline; }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:translateY(0); } }

  /* --- 月送り --- */
  .month-switch{ display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:12px; }
  .month-switch button{
    appearance:none; border:1px solid var(--line); background:var(--surface); border-radius:50%;
    width:36px; height:36px; font-size:15px; cursor:pointer; color:var(--accent); font-weight:800;
  }
  .month-switch button:active{ transform:scale(.9); }
  .month-switch .label{ font-size:16px; font-weight:800; color:var(--accent); min-width:120px; text-align:center; }

  /* --- グラフ --- */
  .chart{ width:100%; display:block; overflow:visible; }
  .chart .grid-line{ stroke:var(--grid); stroke-width:1; shape-rendering:crispEdges; }
  .chart .axis-txt{ fill:var(--ink-faint); font-size:10px; font-variant-numeric:tabular-nums; }
  .chart .bar{ transition:opacity .15s var(--ease-out); }
  .chart .hit{ fill:transparent; cursor:pointer; }
  .chart .hit:hover + .bargroup .bar, .chart .bargroup:hover .bar{ opacity:.78; }

  .donut-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .donut{ width:min(66vw,230px); height:min(66vw,230px); flex:0 0 auto; }
  .donut .seg{ cursor:pointer; transition:opacity .15s var(--ease-out); }
  .donut .seg:hover{ opacity:.75; }
  .donut-center .k{ fill:var(--ink-soft); font-size:7px; font-weight:700; }
  .donut-center .v{ fill:var(--ink); font-size:11px; font-weight:800; }

  /* 凡例は内訳表を兼ねる（薄い色の判別を色だけに頼らせない） */
  .legend{ width:100%; display:flex; flex-direction:column; }
  .legend-row{
    display:flex; align-items:center; gap:10px; padding:9px 2px;
    border-bottom:1px solid var(--line); font-size:13px; width:100%;
    background:transparent; border-left:0; border-right:0; border-top:0; cursor:pointer; color:inherit; text-align:left;
  }
  .legend-row:last-child{ border-bottom:none; }
  .legend-row:active{ background:var(--surface-2); }
  .legend-row .sw{ width:11px; height:11px; border-radius:3px; flex:0 0 auto; }
  .legend-row .nm{ flex:1; min-width:0; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .legend-row .pc{ color:var(--ink-faint); font-size:11.5px; font-variant-numeric:tabular-nums; flex:0 0 auto; }
  .legend-row .vl{ font-weight:800; font-variant-numeric:tabular-nums; flex:0 0 auto; min-width:78px; text-align:right; }

  /* 系列キー（棒グラフの凡例） */
  .keys{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:8px; }
  .keys span{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); font-weight:700; }
  .keys i{ width:10px; height:10px; border-radius:3px; display:inline-block; }

  /* 予算メーター: 未消化部分は同系の薄い段。状態は塗りが持つ */
  .gauge-track{ height:8px; border-radius:5px; background:var(--accent-soft); overflow:hidden; }
  .gauge-fill{ height:100%; border-radius:5px 0 0 5px; background:var(--accent); transition:width .32s var(--ease-spring); }
  .gauge-fill.warn{ background:var(--warn); }
  .gauge-fill.over{ background:var(--red); }
  .bud-row{ padding:12px 0; border-bottom:1px solid var(--line); }
  .bud-row:last-child{ border-bottom:none; }
  .bud-top{ display:flex; align-items:center; gap:9px; margin-bottom:7px; }
  .bud-top .sw{ width:9px; height:22px; border-radius:4px; flex:0 0 auto; }
  .bud-top .nm{ flex:1; min-width:0; font-size:13px; font-weight:700; }
  .bud-top input{ width:96px; padding:6px 8px; font-size:12.5px; text-align:right; border-radius:8px; }
  .bud-bot{ display:flex; justify-content:space-between; font-size:11.5px; margin-top:5px; font-variant-numeric:tabular-nums; }
  .bud-bot .rem.ok{ color:var(--accent); font-weight:700; }
  .bud-bot .rem.warn{ color:var(--warn); font-weight:700; }
  .bud-bot .rem.over{ color:var(--red); font-weight:700; }
  .bud-bot .rem.none{ color:var(--ink-faint); }

  .pace{ display:flex; gap:8px; }
  .pace > div{ flex:1; background:var(--surface-2); border-radius:12px; padding:11px; text-align:center; }
  .pace .k{ font-size:10.5px; color:var(--ink-soft); font-weight:700; }
  .pace .v{ font-size:16px; font-weight:800; margin-top:3px; }

  .tip{
    position:fixed; z-index:95; pointer-events:none; background:var(--ink); color:var(--paper);
    border-radius:9px; padding:7px 10px; font-size:11.5px; font-weight:700; white-space:nowrap;
    box-shadow:var(--shadow-lg); transform:translate(-50%,-120%); opacity:0; transition:opacity .12s;
  }
  .tip.on{ opacity:1; }
  .tip .t2{ display:block; font-weight:500; opacity:.8; font-size:10.5px; margin-top:2px; }

  /* --- 支払予定 --- */
  .pay-row{
    display:flex; align-items:center; gap:10px; width:100%; padding:12px 2px;
    border:0; border-bottom:1px solid var(--line); background:transparent; color:inherit;
    text-align:left; cursor:pointer;
  }
  .pay-row:active{ background:var(--surface-2); }
  .pay-main{ flex:1; min-width:0; }
  .pay-date{ display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:800; flex-wrap:wrap; }
  .pay-sub{ display:block; font-size:11px; color:var(--ink-soft); margin-top:3px; }
  .pay-amt{ font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; flex:0 0 auto; }
  .pay-detail{ background:var(--surface-2); border-radius:10px; padding:8px 11px; margin:2px 0 10px; }
  .pay-item{ display:flex; gap:10px; align-items:baseline; padding:5px 0; font-size:12px; }
  .pay-item .d{ color:var(--ink-faint); flex:0 0 auto; font-variant-numeric:tabular-nums; }
  .pay-item .n{ flex:1; min-width:0; display:flex; align-items:center; gap:6px; }
  .pay-item .n > span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pay-item .a{ font-weight:700; font-variant-numeric:tabular-nums; flex:0 0 auto; }
  .pay-item .a.in{ color:var(--accent); }

  /* --- カレンダー --- */
  .cal-head{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:4px; }
  .cal-head div{ text-align:center; font-size:10.5px; font-weight:800; color:var(--ink-faint); padding:3px 0; }
  .cal-head .sun{ color:var(--red); } .cal-head .sat{ color:var(--accent); }
  .cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-cell{
    position:relative; aspect-ratio:1/1.05; border:1px solid var(--line); border-radius:8px;
    background:var(--surface); padding:3px 2px 2px; cursor:pointer; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:1px;
    min-height:44px;
  }
  .cal-cell.empty{ border-color:transparent; background:transparent; cursor:default; }
  .cal-cell.none{ color:var(--ink-faint); }
  .cal-cell.today{ border-color:var(--accent); border-width:2px; }
  .cal-cell:active:not(.empty){ background:var(--surface-2); }
  /* 塗りは絶対配置なので、数字側にも重なり順を与えないと隠れる */
  .cal-cell .d{ position:relative; z-index:1; font-size:10.5px; font-weight:800; line-height:1.1; }
  .cal-cell .d.sun{ color:var(--red); } .cal-cell .d.sat{ color:var(--accent); }
  .cal-cell .bar{ position:absolute; inset:0; background:var(--s2); z-index:0; }
  .cal-cell .v{ position:relative; z-index:1; font-size:9.5px; font-weight:800;
                font-variant-numeric:tabular-nums; color:var(--ink); }
  .cal-cell .v.muted{ color:var(--ink-faint); }
  .cal-cell .pay{ position:relative; z-index:1; font-size:8px; line-height:1; }
  @media (min-width: 900px){ .cal-cell{ aspect-ratio:1/0.8; min-height:60px; }
    .cal-cell .d{ font-size:12px; } .cal-cell .v{ font-size:11px; } }

  /* --- テンプレート --- */
  .chip.tpl{ display:inline-flex; align-items:center; gap:6px; }
  .tpl-amt{ font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
  .chip[aria-pressed="true"] .tpl-amt{ color:rgba(255,255,255,.75); }

  /* --- 年間サマリー --- */
  .yr-row{ display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line); font-size:13px; }
  .yr-row:last-child{ border-bottom:none; }
  .yr-row .sw{ width:9px; height:22px; border-radius:4px; flex:0 0 auto; }
  .yr-row .nm{ flex:1; min-width:0; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .yr-row .av{ font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums; flex:0 0 auto; }
  .yr-row .tt{ font-weight:800; font-variant-numeric:tabular-nums; flex:0 0 auto; min-width:86px; text-align:right; }
  .yr-row .df{ font-size:11px; font-variant-numeric:tabular-nums; flex:0 0 auto; min-width:62px; text-align:right; }
  .yr-row .df.up{ color:var(--red); } .yr-row .df.down{ color:var(--accent); }

  /* --- 口座ごとの引落まとめ --- */
  .acc-block{ padding:10px 0; border-bottom:1px solid var(--line); }
  .acc-block:last-child{ border-bottom:none; }
  .acc-head{ display:flex; align-items:baseline; gap:9px; margin-bottom:6px; flex-wrap:wrap; }
  .acc-head .nm{ font-size:13.5px; font-weight:800; }
  .acc-head .sub{ font-size:11px; color:var(--ink-faint); }
  .acc-line{ display:flex; align-items:baseline; gap:10px; padding:5px 0; font-size:12.5px; }
  .acc-line.muted{ color:var(--ink-faint); font-size:11.5px; }
  .acc-line .dt{ flex:0 0 auto; font-weight:700; display:flex; align-items:center; gap:6px; font-variant-numeric:tabular-nums; }
  .acc-line .mt{ flex:1; min-width:0; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acc-line .am{ flex:0 0 auto; font-weight:800; font-variant-numeric:tabular-nums; }

  /* --- 設定のサブタブ --- */
  .subtabs{ display:flex; gap:6px; overflow-x:auto; padding:2px 1px 10px; scrollbar-width:none; }
  .subtabs::-webkit-scrollbar{ display:none; }
  .subtabs button{
    flex:0 0 auto; appearance:none; border:1px solid var(--line); background:var(--surface);
    color:var(--ink-soft); border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:700;
    cursor:pointer; min-height:38px; white-space:nowrap;
  }
  .subtabs button[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:#fff; }

  /* --- チェックボックス --- */
  .chk{ display:flex; gap:10px; align-items:flex-start; margin:12px 0 4px; cursor:pointer; }
  .chk input{ width:20px; height:20px; margin:1px 0 0; flex:0 0 auto; accent-color:var(--accent); }
  .chk span{ font-size:13px; font-weight:700; line-height:1.5; }
  .chk em{ display:block; font-style:normal; font-size:11.5px; font-weight:400; color:var(--ink-soft); margin-top:3px; }

  /* --- 設定の一覧行 --- */
  .item{
    display:flex; align-items:center; gap:10px; padding:11px 2px;
    border-bottom:1px solid var(--line);
  }
  .item:last-child{ border-bottom:none; }
  .item .body{ flex:1; min-width:0; }
  .item .t1{ font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .item .t2{ font-size:11px; color:var(--ink-soft); margin-top:3px; }
  .item .amt{ font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; flex:0 0 auto; }
  .item .acts{ display:flex; gap:5px; flex:0 0 auto; }
  .icon-sm{
    appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    width:34px; height:34px; border-radius:9px; cursor:pointer; font-size:13px;
  }
  .icon-sm:active{ transform:scale(.92); }
  .icon-sm.danger{ color:var(--red); }

  .soon{ text-align:center; padding:40px 18px; color:var(--ink-faint); }
  .soon .big{ font-size:40px; display:block; margin-bottom:10px; }
  .soon .ph{ font-size:13px; font-weight:700; color:var(--ink-soft); }
  .soon .ph2{ font-size:11.5px; margin-top:6px; line-height:1.8; }
}

/* ===================================================================
   §V views / §U utils
   =================================================================== */
@layer utils {
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .mt0{ margin-top:0; } .mb0{ margin-bottom:0; }
  .muted{ color:var(--ink-soft); }
  /* 自己テスト */
  #selftest{ position:fixed; inset:0; z-index:200; background:var(--paper); color:var(--ink); overflow:auto; padding:16px; font-size:12px; }
  #selftest h1{ font-size:17px; margin-bottom:10px; }
  #selftest .sum{ padding:11px 14px; border-radius:12px; font-weight:800; margin-bottom:12px; }
  #selftest .sum.ok{ background:var(--accent-soft); color:var(--accent); }
  #selftest .sum.ng{ background:var(--red-soft); color:var(--red); }
  #selftest .g{ font-weight:800; margin:14px 0 5px; color:var(--accent); font-size:12.5px; }
  #selftest .c{ padding:5px 8px; border-bottom:1px solid var(--line); display:flex; gap:9px; align-items:flex-start; }
  #selftest .c.f{ background:var(--red-soft); }
  #selftest .c .st{ flex:0 0 auto; font-weight:800; }
  #selftest .c .nm{ flex:1; }
  #selftest .c .gw{ font-family:ui-monospace,Menlo,monospace; font-size:10.5px; color:var(--ink-soft); white-space:pre-wrap; word-break:break-all; }
}
</style>

<script>
"use strict";
/* ====================================================================
   家計簿トラッカー v2  —  単一HTML / ビルド不要 / 依存ゼロ

   目次（Ctrl-F で §N を検索して移動）
     §1 CONST    定数・既定値・列挙
     §2 UTIL     dom / html`` / esc / yen / 日付
     §3 SCHEMA   スキーマ・マイグレーション・検証
     §4 STORE    状態の読み書き・commit・購読
     §5 SELECT   集計ロジック（メモ化）★DOM非依存・自己テスト対象
     §6 ROUTER   ルーティング
     §7 VIEW     各画面の描画
     §9 UI       シート・トースト・テンキー
     §12 TEST    ?selftest=1
     §13 BOOT    起動
   ==================================================================== */
(function(){

/* ====================================================================
   §1 CONST
   ==================================================================== */
const APP_VERSION   = "2.0.0-phase1";
const SCHEMA_VERSION= 2;
const KEY_STATE     = "kakeibo_state";
const KEY_V1        = "kakeibo_tracker_state_v1";   // 永久に触らない（退路）
const KEY_UNDO      = "kakeibo_undo_snapshot";

const WD_JP = ["日","月","火","水","木","金","土"];

const SUB_STATUS      = ["有効","一時停止","解約予定","停止"];
// 休日調整: エンジンが実際に処理できる選択肢だけを見せる
const HOLIDAY_ADJUST  = ["翌営業日","前営業日","翌営業日(月跨ぎは前営業日)","調整なし"];
const INTERVALS       = ["月次","週次","年次"];

const CAT_SUB    = "cat_subscription";
const CAT_UNCAT  = "cat_uncategorized";
const CAT_SAVING = "cat_saving";

/* 取引の種別。
   貯蓄・投資（積立NISAなど）は「支出」ではなく「振替」として持つ。
   消費ではなくお金の置き場所が変わっただけで、純資産は減っていないため。
   支出に混ぜると、使いすぎの判断・予算のペース・節約診断が全部ずれる。 */
const TX_TYPES = ["expense","refund","earning","transfer"];

/* 系列色は8スロット。色はカテゴリに固定し、順位では決めない
   （絞り込みで件数が変わっても残った色が塗り替わらないようにするため）。
   9個目のスロットは作らず「その他」にまとめる。実際の色はCSS変数側にあり、
   ライト/ダークで別々に検証済みの値が入る。 */
const SERIES_N = 8;
const slotVar  = n => "var(--s" + ((Number(n) || 0) % SERIES_N + 1) + ")";

const SEED_CATEGORIES = [
  ["食費","🍚"],["日用品","🧴"],["交通費","🚃"],["交際費","🍻"],["趣味・娯楽","🎮"],
  ["衣服・美容","👕"],["健康・医療","💊"],["水道光熱","💡"],["通信費","📱"],["住居","🏠"],
];
const SEED_METHODS = [["現金","cash"],["クレジットカード","card"],["電子マネー","emoney"],["口座引落","bank"]];

/* ====================================================================
   §2 UTIL
   ==================================================================== */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));

/* --- エスケープを既定にする ---
   html`` に渡した値は自動でエスケープされる。生HTMLを入れたいときだけ raw()。 */
const RAW = Symbol("raw");
const isRaw = v => !!v && typeof v === "object" && RAW in v;
/** 明示的に生HTMLを入れる。html`` の結果はそのまま通す。 */
const raw = s => isRaw(s) ? s : ({ [RAW]: String(s) });
/** RAW を文字列へ。生の値はエスケープする。 */
const toHTML = v => isRaw(v) ? v[RAW] : esc(v);
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function part(v){
  if (v == null || v === false) return "";
  if (Array.isArray(v)) return v.map(part).join("");
  if (isRaw(v)) return v[RAW];
  return esc(v);
}
/** html`` は RAW を返す。これが文字列だと入れ子にしたときに二重エスケープされる。 */
function html(strings, ...vals){
  let out = strings[0];
  for (let i = 0; i < vals.length; i++) out += part(vals[i]) + strings[i+1];
  return { [RAW]: out };
}
function mount(el, v){ if (el) el.innerHTML = toHTML(v); return el; }

const uid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const byId = (arr, id) => arr.find(x => x.id === id) || null;

function yen(n){
  const v = Math.round(n||0), sign = v<0 ? "−" : "";
  return sign + "¥" + Math.abs(v).toLocaleString("ja-JP");
}

/* --- 日付 --- */
const pad2 = n => String(n).padStart(2,"0");
const fmt  = d => d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const parseDate = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, m-1, d); };
const todayStr  = () => fmt(new Date());
const monthEndDay = (y,m) => new Date(y, m, 0).getDate();          // m: 1-12
const monthKeyOf  = (y,m) => y + "-" + pad2(m);
function addMonths(y,m,n){ let mm=m+n, yy=y; while(mm>12){mm-=12;yy++;} while(mm<1){mm+=12;yy--;} return [yy,mm]; }
const isWeekend = d => d.getDay()===0 || d.getDay()===6;
function jpDate(s){ const d=parseDate(s); return (d.getMonth()+1)+"/"+d.getDate()+"（"+WD_JP[d.getDay()]+"）"; }

/* ====================================================================
   §3 SCHEMA — 既定値・マイグレーション・検証
   ==================================================================== */
function emptyState(){
  const now = new Date().toISOString();
  return {
    schemaVersion: SCHEMA_VERSION,
    meta: { createdAt: now, updatedAt: now, appVersion: APP_VERSION },
    prefs:{ theme:"auto", keypad:true, lastRoute:"status" },
    accounts:[], methods:[], categories:[],
    transactions:[], subscriptions:[], subOverrides:{}, templates:[],
    budgets:{}, holidays:{},
  };
}

function systemCategories(){
  return [
    { id:CAT_SUB,    name:"サブスク・固定費", colorSlot:6, icon:"🔁", order:900, archived:false, system:true, kind:"expense" },
    { id:CAT_UNCAT,  name:"未分類",           colorSlot:5, icon:"❓", order:999, archived:false, system:true, kind:"expense" },
    // 貯蓄・投資は用途（消費の内訳）ではないので kind を分けている。
    // 円グラフ・予算・節約診断はこれを見ない
    { id:CAT_SAVING, name:"貯蓄・投資",       colorSlot:2, icon:"🏦", order:910, archived:false, system:true, kind:"saving" },
  ];
}

/** 新規インストール時の初期データ。空だと1件も記録できない行き止まりになるため。 */
function seedState(){
  const s = emptyState();
  s.categories = SEED_CATEGORIES.map(([name,icon],i) => ({
    id: uid("cat"), name, icon, colorSlot: i % SERIES_N,
    order: i, archived:false, system:false, kind:"expense",
  }));
  s.categories.push(...systemCategories());
  s.categories.push({ id:uid("cat"), name:"その他", icon:"📦", colorSlot:7, order:890, archived:false, system:false, kind:"expense" });
  s.methods = SEED_METHODS.map(([name,kind],i) => ({
    id: uid("mth"), name, kind, order:i, archived:false, billing:null,
  }));
  return s;
}

/** v1（旧 kakeibo_tracker_state_v1 の形）→ v2
 *  方針: 1件も落とさない。対応が見つからない文字列はその場で実体を作って繋ぐ。 */
function v1_to_v2(v1){
  const s = emptyState();
  const pd = v1.pulldowns || {};
  const report = { categories:0, methods:0, accounts:0, transactions:0, subscriptions:0, cards:0, budgets:0, created:[] };

  /* --- 用途 --- */
  const catByName = new Map();
  (pd.categories || []).forEach((name, i) => {
    if (!name || catByName.has(name)) return;
    const c = { id:uid("cat"), name, icon:"", colorSlot: i % SERIES_N,
                order:i, archived:false, system:false, kind:"expense" };
    s.categories.push(c); catByName.set(name, c); report.categories++;
  });
  systemCategories().forEach(c => { s.categories.push(c); catByName.set(c.name, c); });
  const ensureCat = name => {
    if (!name) return CAT_UNCAT;
    if (catByName.has(name)) return catByName.get(name).id;
    const c = { id:uid("cat"), name, icon:"", colorSlot: s.categories.length % SERIES_N,
                order:s.categories.length, archived:false, system:false, kind:"expense" };
    s.categories.push(c); catByName.set(name, c); report.created.push("用途:"+name);
    return c.id;
  };

  /* --- 引落口座 --- */
  const accByName = new Map();
  (pd.accounts || []).forEach((name,i) => {
    if (!name || accByName.has(name)) return;
    const a = { id:uid("acc"), name, balance:null, balanceAsOf:null, order:i, archived:false };
    s.accounts.push(a); accByName.set(name, a); report.accounts++;
  });
  const ensureAcc = name => {
    if (!name) return null;
    if (accByName.has(name)) return accByName.get(name).id;
    const a = { id:uid("acc"), name, balance:null, balanceAsOf:null, order:s.accounts.length, archived:false };
    s.accounts.push(a); accByName.set(name, a); report.created.push("口座:"+name);
    return a.id;
  };

  /* --- 支払方法（カードを統合する） --- */
  const mthByName = new Map();
  (pd.methods || []).forEach((name,i) => {
    if (!name || mthByName.has(name)) return;
    const m = { id:uid("mth"), name, kind:"cash", order:i, archived:false, billing:null };
    s.methods.push(m); mthByName.set(name, m); report.methods++;
  });
  const ensureMth = name => {
    if (!name) name = "不明";
    if (mthByName.has(name)) return mthByName.get(name).id;
    const m = { id:uid("mth"), name, kind:"cash", order:s.methods.length, archived:false, billing:null };
    s.methods.push(m); mthByName.set(name, m); report.created.push("支払方法:"+name);
    return m.id;
  };
  // v1 のカードは名前でしか支払方法と繋がっていない。名前一致で救出し、無ければ作る。
  (v1.cards || []).forEach(card => {
    if (!card || !card.name) return;
    const billing = {
      accountId:   ensureAcc(card.account),
      closeType:   card.closeType || "毎月指定日",
      closeDay:    Number(card.closeDay) || 1,
      payOffset:   Number(card.payOffset) || 0,
      payDayType:  card.payDayType || "date",
      payDay:      Number(card.payDay) || 1,
      holidayAdjust: HOLIDAY_ADJUST.includes(card.holidayAdjust) ? card.holidayAdjust : "翌営業日",
    };
    const id = ensureMth(card.name);
    const m  = byId(s.methods, id);
    m.kind = "card"; m.billing = billing; report.cards++;
  });

  /* --- 取引: 負の金額 → refund（挙動は現状と完全に同じ） --- */
  (v1.transactions || []).forEach(t => {
    if (!t || !t.date) return;
    const amt = Number(t.amount) || 0;
    s.transactions.push({
      id: t.id || uid("t"),
      date: t.date,
      amount: Math.abs(amt),
      type: amt < 0 ? "income" : "expense",
      incomeKind: amt < 0 ? "refund" : null,
      methodId: ensureMth(t.method),
      categoryId: ensureCat(t.category),
      detail: t.detail || "",
      tags: [],
      createdAt: s.meta.createdAt,
    });
    report.transactions++;
  });

  /* --- サブスク --- */
  (v1.subscriptions || []).forEach(x => {
    if (!x) return;
    s.subscriptions.push({
      id: x.id || uid("sub"),
      name: x.name || "（無題）",
      amount: Math.abs(Number(x.amount) || 0),
      methodId: ensureMth(x.method),
      categoryId: CAT_SUB,
      interval: INTERVALS.includes(x.interval) ? x.interval : "月次",
      start: x.start || todayStr(),
      end: null,
      status: SUB_STATUS.includes(x.status) ? x.status : (x.status === "有効" ? "有効" : "停止"),
      pauseFrom: null, pauseTo: null,
      memo: x.memo || "",
    });
    report.subscriptions++;
  });

  /* --- 予算: カテゴリ名キー → カテゴリIDキー --- */
  Object.entries(v1.budgets || {}).forEach(([mk, obj]) => {
    if (!/^\d{4}-\d{2}$/.test(mk) || !obj || typeof obj !== "object") return;
    const dst = {};
    Object.entries(obj).forEach(([name, amt]) => {
      if (!Number.isFinite(Number(amt))) return;
      dst[ensureCat(name)] = Number(amt);       // 明示的な 0 も必ず保持する
    });
    s.budgets[mk] = dst; report.budgets++;
  });

  /* --- 祝日: 文字列 → {name, source} --- */
  Object.entries(v1.holidays || {}).forEach(([d, name]) => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
    s.holidays[d] = { name: typeof name === "string" ? name : (name && name.name) || "祝日",
                      source: (name && name.source) || "api" };
  });

  s.meta.migratedFrom = "v1";
  s.meta.migrationReport = report;
  return s;
}

const MIGRATIONS = { 1: v1_to_v2 };

/** このアプリのデータに見えるか。
 *  これが無いと、無関係なJSONが移行処理を素通りして「空だが形式上は正しい状態」
 *  になり、既存の家計簿を丸ごと置き換えてしまう（実際に起きた）。
 *  中身が空でも構わないが、形が違うものは受け付けない。 */
function looksLikeKakeibo(raw){
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return false;
  const v = Number(raw.schemaVersion) || 0;
  if (v >= 2){
    // v2以降: 取引配列と、用途か支払方法のどちらかがあること
    return Array.isArray(raw.transactions)
        && (Array.isArray(raw.categories) || Array.isArray(raw.methods));
  }
  // v1: 取引配列に加えて、v1特有の入れ物があること
  return Array.isArray(raw.transactions)
      && (Array.isArray(raw.cards)
          || Array.isArray(raw.subscriptions)
          || (raw.pulldowns && typeof raw.pulldowns === "object"));
}

function migrate(rawState){
  let s = rawState, v = Number(s && s.schemaVersion) || 1, guard = 0;
  while (MIGRATIONS[v]){
    s = MIGRATIONS[v](s);
    const nv = Number(s.schemaVersion);
    if (nv <= v || ++guard > 20) throw new Error("migration loop");
    v = nv;
  }
  if (v > SCHEMA_VERSION) throw new Error("新しいバージョンのデータです。アプリを更新してください。");
  return s;
}

/** 検証: 拒否より修復を優先する。唯一のバックアップを復元しようとしている人を1行で止めない。 */
function validate(input){
  const errors = [], repaired = [];
  const S = JSON.parse(JSON.stringify(input));
  if (!S || typeof S !== "object") throw new Error("データの形式が正しくありません");
  if (!Array.isArray(S.transactions)) throw new Error("取引データが見つかりません");

  ["accounts","methods","categories","transactions","subscriptions","templates"].forEach(k=>{
    if (!Array.isArray(S[k])){ S[k] = []; repaired.push(k+"を初期化"); }
  });
  ["budgets","holidays","subOverrides"].forEach(k=>{
    if (!S[k] || typeof S[k] !== "object"){ S[k] = {}; repaired.push(k+"を初期化"); }
  });
  if (!S.prefs || typeof S.prefs !== "object") S.prefs = emptyState().prefs;
  if (!S.meta  || typeof S.meta  !== "object") S.meta  = emptyState().meta;

  // システムカテゴリは必ず在る
  systemCategories().forEach(sc => { if (!byId(S.categories, sc.id)) S.categories.push(sc); });
  // 貯蓄・投資という区別を後から足したので、古い状態にも補う
  S.categories.forEach(c => { if (!c.kind) c.kind = c.id === CAT_SAVING ? "saving" : "expense"; });
  // 振替なのに用途が消費側を指していたら、預け先へ寄せる
  S.transactions.forEach(t => {
    const c = byId(S.categories, t.categoryId);
    if (t.type === "transfer" && (!c || c.kind !== "saving")){ t.categoryId = CAT_SAVING; repaired.push("預け先を補正"); }
    if (t.type !== "transfer" && c && c.kind === "saving"){ t.type = "transfer"; repaired.push("貯蓄として補正"); }
  });
  if (!S.methods.length){ S.methods = seedState().methods; repaired.push("支払方法を初期化"); }

  const before = S.transactions.length;
  const seen = new Set();
  S.transactions = S.transactions.filter(t => {
    if (!t || !/^\d{4}-\d{2}-\d{2}$/.test(t.date)){ errors.push("日付が不正な行"); return false; }
    if (!Number.isFinite(Number(t.amount))){ errors.push("金額が不正な行"); return false; }
    if (!t.id || seen.has(t.id)){ t.id = uid("t"); repaired.push("ID重複を採番"); }
    seen.add(t.id);
    t.amount = Math.abs(Number(t.amount));
    if (!["income","expense","transfer"].includes(t.type)) t.type = "expense";
    if (t.type === "income" && t.incomeKind !== "earning") t.incomeKind = "refund";
    if (t.type !== "income") t.incomeKind = null;
    if (!byId(S.categories, t.categoryId)){ t.categoryId = CAT_UNCAT; repaired.push("用途を未分類に"); }
    if (!byId(S.methods, t.methodId)){
      const m = S.methods[0]; t.methodId = m ? m.id : null; repaired.push("支払方法を補正");
    }
    return true;
  });
  if (before > 0 && S.transactions.length < before * 0.5)
    throw new Error("このファイルは壊れているようです（" + (before - S.transactions.length) + "/" + before + "件が不正）");

  S.subscriptions.forEach(x => {
    if (!SUB_STATUS.includes(x.status)) x.status = "停止";
    if (!byId(S.categories, x.categoryId)) x.categoryId = CAT_SUB;
  });
  S.schemaVersion = SCHEMA_VERSION;
  return { state:S, errors, repaired };
}

/* ====================================================================
   §4 STORE — 差分再描画つきの状態管理
   ==================================================================== */
const D = { TX:"tx", SUB:"sub", METHOD:"method", CAT:"cat", BUDGET:"budget",
            ACCOUNT:"account", HOLIDAY:"holiday", PREF:"pref", UI:"ui" };

const Store = (function(){
  let state = null, rev = 0, ephemeral = false;
  const views = [];
  const dirty = new Set();
  let queued = false, saveT = 0;

  function persist(){
    if (ephemeral) return;
    try{
      state.meta.updatedAt = new Date().toISOString();
      localStorage.setItem(KEY_STATE, JSON.stringify(state));
    }catch(e){
      Toast.show("保存できませんでした（端末の空き容量をご確認ください）", { kind:"err", ms:0 });
    }
  }
  function scheduleSave(){ clearTimeout(saveT); saveT = setTimeout(persist, 120); }

  const isVisible = host => !!host && !host.hasAttribute("hidden") && !host.closest("[hidden]");

  function flush(){
    queued = false;
    const d = new Set(dirty); dirty.clear();
    for (const v of views){
      if (!v.deps.some(x => d.has(x))) continue;
      if (!isVisible(v.host)) { v.stale = true; continue; }
      // 予算欄などで入力中に再描画するとカーソルが飛ぶので保留する
      if (v.deferIfFocused && v.host.contains(document.activeElement)) { v.stale = true; continue; }
      try { v.render(state); v.stale = false; } catch(e){ console.error("[render]", v.id, e); }
    }
  }
  function scheduleFlush(){ if (queued) return; queued = true; requestAnimationFrame(flush); }

  return {
    get state(){ return state; },
    get rev(){ return rev; },
    init(s){ state = s; rev++; },
    commit(mutate, ...touched){
      const out = mutate(state);
      rev++;
      touched.forEach(t => dirty.add(t));
      scheduleSave(); scheduleFlush();
      return out;
    },
    replace(next){ state = next; rev++; Object.values(D).forEach(t=>dirty.add(t)); persist(); scheduleFlush(); },
    register(id, deps, render, host, opt){
      views.push({ id, deps, render, host, stale:true, deferIfFocused: !!(opt && opt.deferIfFocused) });
    },
    refreshStale(){
      for (const v of views) if (v.stale && isVisible(v.host)){
        try { v.render(state); v.stale = false; } catch(e){ console.error("[render]", v.id, e); }
      }
    },
    invalidateAll(){ Object.values(D).forEach(t=>dirty.add(t)); scheduleFlush(); },
    /** 自己テスト用: localStorage に一切触らない一時状態に差し替える */
    __useEphemeral(s){ state = s; ephemeral = true; rev++; },
    __endEphemeral(){ ephemeral = false; },
  };
})();

/* ====================================================================
   §5 SELECT — 集計ロジック（DOM非依存・自己テスト対象）
   ==================================================================== */
function memo(fn){
  let cache = new Map(), cachedRev = -1;
  return function(){
    if (cachedRev !== Store.rev){ cache = new Map(); cachedRev = Store.rev; }
    const k = Array.prototype.join.call(arguments, "");
    if (!cache.has(k)) cache.set(k, fn.apply(null, arguments));
    return cache.get(k);
  };
}

const Sel = {};

/* --- 参照ヘルパ --- */
Sel.cat = id => byId(Store.state.categories, id) ||
                { id, name:"未分類", colorSlot:5, icon:"❓", order:999, archived:false, system:true };
Sel.mth = id => byId(Store.state.methods, id) ||
                { id, name:"不明", kind:"cash", order:999, archived:false, billing:null };
Sel.acc = id => byId(Store.state.accounts, id);
/** 用途＝消費の内訳。貯蓄・投資は消費ではないので、ここには含めない。
 *  円グラフ・予算・節約診断・年間の用途別は、すべてこれを回している。 */
Sel.activeCategories = () => Store.state.categories
  .filter(c => !c.archived && (c.kind || "expense") !== "saving")
  .sort((a,b)=>a.order-b.order);
/** 振替先（積立NISA・定期預金など） */
Sel.savingCategories = () => Store.state.categories
  .filter(c => !c.archived && c.kind === "saving")
  .sort((a,b)=>a.order-b.order);
Sel.allCategories = () => Store.state.categories
  .filter(c => !c.archived).sort((a,b)=>a.order-b.order);
Sel.activeMethods    = () => Store.state.methods.filter(m => !m.archived).sort((a,b)=>a.order-b.order);
/** 手入力の候補。サブスク用は自動計上されるので、未分類は移行の受け皿なので出さない。
 *  ただし実際にその用途が使われている場合は編集できるよう残す。 */
Sel.entryCategories = (type) => {
  if (type === "transfer") return Sel.savingCategories();
  const used = new Set(Store.state.transactions.map(t => t.categoryId));
  return Sel.activeCategories().filter(c =>
    c.id !== CAT_SUB && (c.id !== CAT_UNCAT || used.has(CAT_UNCAT)));
};

/* --- 祝日・営業日 --- */
Sel.isHoliday    = d => !!Store.state.holidays[fmt(d)];
Sel.isBusinessDay= d => !isWeekend(d) && !Sel.isHoliday(d);

/** 休日調整。上限を設けて、祝日データが壊れていてもタブが固まらないようにする。 */
function adjustForHoliday(d, rule){
  const MAX = 60;
  const walk = (dir) => {
    const x = new Date(d); let n = 0;
    while (!Sel.isBusinessDay(x) && n < MAX){ x.setDate(x.getDate() + dir); n++; }
    return n >= MAX ? new Date(d) : x;
  };
  if (rule === "前営業日") return walk(-1);
  if (rule === "翌営業日") return walk(1);
  if (rule === "翌営業日(月跨ぎは前営業日)"){
    const fwd = walk(1);
    return fwd.getMonth() !== d.getMonth() ? walk(-1) : fwd;
  }
  return new Date(d);   // 調整なし / 未知の値
}
Sel.adjustForHoliday = adjustForHoliday;

/* --- カード締め日・支払日 --- */
function closeDateForMonth(b, y, m){
  const day = b.closeType === "月末" ? monthEndDay(y,m) : Math.min(b.closeDay || 1, monthEndDay(y,m));
  return new Date(y, m-1, day);
}
/** 取引日が属する締めサイクルの末日。締め日ちょうどは当サイクル（<=）。 */
function findCycleEnd(b, txDate){
  const y = txDate.getFullYear(), m = txDate.getMonth()+1;
  const ce = closeDateForMonth(b, y, m);
  if (txDate.getTime() <= ce.getTime()) return ce;
  const [y2,m2] = addMonths(y, m, 1);
  return closeDateForMonth(b, y2, m2);
}
function rawPaymentDateFromCycleEnd(b, cycleEnd){
  const [py,pm] = addMonths(cycleEnd.getFullYear(), cycleEnd.getMonth()+1, b.payOffset || 0);
  const day = b.payDayType === "末日" ? monthEndDay(py,pm) : Math.min(b.payDay || 1, monthEndDay(py,pm));
  return new Date(py, pm-1, day);
}
Sel.closeDateForMonth = closeDateForMonth;
Sel.findCycleEnd = findCycleEnd;
Sel.rawPaymentDateFromCycleEnd = rawPaymentDateFromCycleEnd;

/** 取引日 → {cycleEnd, rawPayDate, payDate(調整後), adjusted} */
Sel.scheduleFor = function(methodId, dateStr){
  const m = byId(Store.state.methods, methodId);
  if (!m || !m.billing) return null;
  const cycleEnd = findCycleEnd(m.billing, parseDate(dateStr));
  const rawPay   = rawPaymentDateFromCycleEnd(m.billing, cycleEnd);
  const payDate  = adjustForHoliday(rawPay, m.billing.holidayAdjust);
  return { method:m, cycleEnd, rawPayDate:rawPay, payDate, adjusted: fmt(rawPay) !== fmt(payDate) };
};

/* --- サブスクの発生日展開 ---
   v1 は start から1か月ずつ進めていたので、古い開始日ほど毎回重かった。
   初回位置を算術で求める。状態(一時停止/解約予定/停止)もここで効かせる。 */
Sel.subOccurrences = function(sub, from, to){
  const out = [];
  if (!sub || sub.status === "停止") return out;
  const start = parseDate(sub.start);
  const hardEnd = sub.end ? parseDate(sub.end) : null;
  const limit = hardEnd && hardEnd < to ? hardEnd : to;
  if (start > limit) return out;

  const pauseFrom = sub.pauseFrom ? parseDate(sub.pauseFrom) : null;
  const pauseTo   = sub.pauseTo   ? parseDate(sub.pauseTo)   : null;
  const paused = d => {
    if (sub.status !== "一時停止") return false;
    if (!pauseFrom && !pauseTo) return true;               // 期間未指定なら全期間停止
    if (pauseFrom && d < pauseFrom) return false;
    if (pauseTo   && d > pauseTo)   return false;
    return true;
  };
  const push = d => {
    if (d < from || d > limit) return;
    if (paused(d)) return;
    const ov = Store.state.subOverrides[sub.id + "|" + fmt(d)];
    if (ov === null) return;                                // この回はスキップ
    out.push({ date: new Date(d), amount: ov === undefined ? sub.amount : Number(ov) });
  };

  if (sub.interval === "週次"){
    const step = 7 * 86400000;
    let k = Math.max(0, Math.ceil((from - start) / step));
    let d = new Date(start); d.setDate(d.getDate() + k*7);
    let guard = 0;
    while (d <= limit && guard++ < 600){ push(d); d = new Date(d); d.setDate(d.getDate()+7); }
  } else if (sub.interval === "年次"){
    let y = Math.max(start.getFullYear(), from.getFullYear());
    let guard = 0;
    while (guard++ < 200){
      const mm = start.getMonth()+1;
      const d = new Date(y, mm-1, Math.min(start.getDate(), monthEndDay(y,mm)));
      if (d > limit) break;
      if (d >= start) push(d);
      y++;
    }
  } else {                                                  // 月次
    const sy = start.getFullYear(), sm = start.getMonth()+1;
    let k = Math.max(0, (from.getFullYear()-sy)*12 + (from.getMonth()+1-sm) - 1);
    let guard = 0;
    while (guard++ < 900){
      const [y,m] = addMonths(sy, sm, k);
      // 月末クランプ。翌月は元の日に戻る（28日に固定されない）
      const d = new Date(y, m-1, Math.min(start.getDate(), monthEndDay(y,m)));
      if (d > limit) break;
      if (d >= start) push(d);
      k++;
    }
  }
  return out;
};

/** 実取引 ＋ サブスク展開を統合した「唯一のストリーム」。
 *  月次集計・円グラフ・予算・支払予定・推移グラフ・書き出しが全部これを読むので、
 *  2つ目の集計経路が存在せず、合計とスライスが食い違えない。 */
Sel.entriesInRange = memo(function(fromISO, toISO){
  const from = parseDate(fromISO), to = parseDate(toISO);
  const out = [];
  for (const t of Store.state.transactions){
    if (t.date < fromISO || t.date > toISO) continue;
    out.push({
      date:t.date, amount:t.amount, type:t.type, incomeKind:t.incomeKind,
      categoryId:t.categoryId, methodId:t.methodId,
      label: t.detail || Sel.cat(t.categoryId).name,
      source:"tx", id:t.id,
    });
  }
  for (const s of Store.state.subscriptions){
    for (const o of Sel.subOccurrences(s, from, to)){
      out.push({
        date: fmt(o.date), amount:o.amount, type:"expense", incomeKind:null,
        categoryId: s.categoryId || CAT_SUB, methodId: s.methodId,
        label: s.name, source:"sub", id:s.id,
      });
    }
  }
  out.sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  return out;
});

const monthRange = mk => {
  const [y,m] = mk.split("-").map(Number);
  return [mk + "-01", mk + "-" + pad2(monthEndDay(y,m))];
};
Sel.monthRange = monthRange;

/** 月の集計。用途別の値は「支出 − refund」なので、立て替え精算が
 *  その用途から引かれる v1 の挙動がそのまま保たれる。 */
Sel.monthTotals = memo(function(monthKey){
  const [a,b] = monthRange(monthKey);
  const entries = Sel.entriesInRange(a,b);
  const totals = {};
  Sel.activeCategories().forEach(c => { totals[c.id] = 0; });
  const savings = {};
  Sel.savingCategories().forEach(c => { savings[c.id] = 0; });
  let expense = 0, income = 0, saving = 0;
  for (const e of entries){
    if (e.type === "transfer"){
      // 貯蓄・投資は消費ではないので支出に足さない。用途の内訳にも入れない
      savings[e.categoryId] = (savings[e.categoryId]||0) + e.amount;
      saving += e.amount;
    } else if (e.type === "income"){
      if (e.incomeKind === "earning"){ income += e.amount; }
      else { totals[e.categoryId] = (totals[e.categoryId]||0) - e.amount; expense -= e.amount; }
    } else {
      totals[e.categoryId] = (totals[e.categoryId]||0) + e.amount;
      expense += e.amount;
    }
  }
  return {
    totals, savings, expense, income, saving,
    // 差引＝手元に残った額。貯蓄も財布からは出ているので引く
    net: income - expense - saving,
    savingRate: income > 0 ? saving / income : null,
    entries,
  };
});

/** 予算の繰り越し。設定済みの直近月を継承する。
 *  ⚠️ hasOwnProperty で見ること。「今月あえて0にした」が古い非0の値に勝つ必要がある。
 *     if (b[catId]) と書くと 0 が falsy なので黙って壊れる。 */
Sel.budgetOf = memo(function(monthKey, catId){
  const B = Store.state.budgets;
  const keys = Object.keys(B).filter(k => k <= monthKey).sort().reverse();
  for (const k of keys){
    if (B[k] && Object.prototype.hasOwnProperty.call(B[k], catId)) return Number(B[k][catId]) || 0;
  }
  return 0;
});

Sel.gauge = function(spent, budget){
  if (!(budget > 0)) return { pct:0, level:"none" };
  const ratio = spent / budget;
  return { pct: Math.min(100, Math.max(0, ratio*100)),
           level: ratio > 1 ? "over" : ratio >= 0.8 ? "warn" : "ok" };
};

Sel.catColor = id => slotVar(Sel.cat(id).colorSlot);

/** ドーナツ用の内訳。円は一目で割合を見るためのものなので分割は6つまで。
 *  それを超えた分は「その他」に畳む（色を増やして見分けられなくしない）。 */
const DONUT_MAX = 6;
Sel.breakdown = memo(function(monthKey){
  const { totals, expense } = Sel.monthTotals(monthKey);
  const all = Sel.activeCategories()
    .map(c => ({ id:c.id, name:c.name, icon:c.icon, colorSlot:c.colorSlot, value:totals[c.id] || 0 }))
    .filter(r => r.value !== 0)
    .sort((a,b) => b.value - a.value);

  // 用途は立替精算が使った額を上回るとマイナスになりうる。円は割合を見るものなので
  // マイナスの扇は描けない。正の分だけで円を作り、中央の合計もその和にする
  // （マイナス分は別に注記する）。こうしないと「スライスの和 ≠ 中央の数字」になる。
  const rows = all.filter(r => r.value > 0);
  const negatives = all.filter(r => r.value < 0);

  let slices = rows;
  if (rows.length > DONUT_MAX){
    const head = rows.slice(0, DONUT_MAX - 1);
    const rest = rows.slice(DONUT_MAX - 1);
    slices = head.concat([{
      id:"__other", name:"その他（" + rest.length + "件）", icon:"",
      colorSlot:7, value: rest.reduce((a,r) => a + r.value, 0), rest,
    }]);
  }
  const total = rows.reduce((a,r) => a + r.value, 0);
  return { rows, negatives, slices, total, expense, all };
});

/** 直近nヶ月の支出・収入・収支。どれも同じ「円」なので軸は1本で足りる。 */
Sel.trend = memo(function(monthKey, n){
  const out = [];
  const [y0,m0] = monthKey.split("-").map(Number);
  for (let i = n - 1; i >= 0; i--){
    const [y,m] = addMonths(y0, m0, -i);
    const mk = monthKeyOf(y,m);
    const t = Sel.monthTotals(mk);
    out.push({ monthKey:mk, y, m, expense:t.expense, income:t.income, saving:t.saving, net:t.net });
  }
  return out;
});

/** 今月あと使えるお金と1日あたりのペース。 */
Sel.pace = memo(function(monthKey){
  const { totals, expense } = Sel.monthTotals(monthKey);
  let budget = 0;
  Sel.activeCategories().forEach(c => { budget += Sel.budgetOf(monthKey, c.id); });

  const [y,m] = monthKey.split("-").map(Number);
  const days = monthEndDay(y,m);
  const now = new Date();
  const isCurrent = now.getFullYear() === y && now.getMonth()+1 === m;
  const elapsed = isCurrent ? now.getDate() : days;
  const left = Math.max(0, days - elapsed);

  return {
    budget, expense, days, elapsed, left, isCurrent,
    remain: budget > 0 ? budget - expense : null,
    perDaySoFar: elapsed > 0 ? expense / elapsed : 0,
    perDayLeft: (budget > 0 && left > 0) ? Math.max(0, budget - expense) / left : null,
  };
});

/** よく使う入力の候補。直近60日で頻度の高い「用途×支払方法×メモ」を拾う。
 *  手で登録したテンプレートを先に、足りない分を自動の候補で埋める。 */
Sel.templates = memo(function(){
  const saved = Store.state.templates || [];
  const since = fmt(new Date(Date.now() - 60*86400000));
  const freq = new Map();
  for (const t of Store.state.transactions){
    if (t.date < since || t.type !== "expense") continue;
    const key = t.categoryId + "|" + t.methodId + "|" + (t.detail || "");
    if (!freq.has(key)) freq.set(key, { n:0, sum:0, categoryId:t.categoryId, methodId:t.methodId, detail:t.detail || "" });
    const e = freq.get(key); e.n++; e.sum += t.amount;
  }
  const isSaved = x => saved.some(s =>
    s.categoryId === x.categoryId && s.methodId === x.methodId && (s.detail || "") === x.detail);

  const auto = Array.from(freq.values())
    .filter(x => x.n >= 2 && !isSaved(x))          // 1回きりのものは候補にしない
    .sort((a,b) => b.n - a.n)
    .slice(0, Math.max(0, 4 - saved.length))
    .map(x => ({ id:"auto:" + x.categoryId + "|" + x.methodId + "|" + x.detail,
                 label: x.detail || Sel.cat(x.categoryId).name,
                 amount: Math.round(x.sum / x.n),  // よく使う金額を初期値にする
                 categoryId:x.categoryId, methodId:x.methodId, detail:x.detail, auto:true, n:x.n }));

  return saved.map(s => Object.assign({}, s, { auto:false })).concat(auto);
});

/** カレンダー用。その月の日ごとの支出額と、カードの引き落とし日。 */
Sel.calendar = memo(function(monthKey){
  const [y,m] = monthKey.split("-").map(Number);
  const [a,b] = monthRange(monthKey);
  const entries = Sel.entriesInRange(a,b);

  const byDay = {};
  for (const e of entries){
    const d = Number(e.date.slice(8));
    if (!byDay[d]) byDay[d] = { spend:0, income:0, saving:0, n:0 };
    if (e.type === "transfer"){
      byDay[d].saving = (byDay[d].saving || 0) + e.amount;   // 貯蓄は支出に数えない
    } else if (e.type === "income"){
      if (e.incomeKind === "earning") byDay[d].income += e.amount;
      else byDay[d].spend -= e.amount;
    } else byDay[d].spend += e.amount;
    byDay[d].n++;
  }

  // 引き落とし日に印を付ける
  const pays = {};
  for (const mt of Sel.activeMethods()){
    if (!mt.billing) continue;
    const sc = Sel.cardSchedule(mt.id);
    if (!sc) continue;
    for (const g of sc.groups){
      if (!g.payDate.startsWith(monthKey)) continue;
      const d = Number(g.payDate.slice(8));
      if (!pays[d]) pays[d] = { total:0, names:[] };
      pays[d].total += g.total; pays[d].names.push(mt.name);
    }
  }

  const days = monthEndDay(y,m);
  const lead = new Date(y, m-1, 1).getDay();       // 月初の曜日ぶん空ける
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(null);
  for (let d = 1; d <= days; d++){
    cells.push({ d, date: monthKey + "-" + pad2(d), ...(byDay[d] || { spend:0, income:0, saving:0, n:0 }),
                 pay: pays[d] || null,
                 weekend: [0,6].includes(new Date(y,m-1,d).getDay()),
                 holiday: !!Store.state.holidays[monthKey + "-" + pad2(d)] });
  }
  const max = Math.max(1, ...cells.filter(Boolean).map(c => c.spend));
  return { cells, max, days };
});

/** 年間サマリー。用途別の年計・月平均と、前年との比較。 */
Sel.annual = memo(function(year){
  const cats = Sel.activeCategories();
  const rows = cats.map(c => ({ id:c.id, name:c.name, icon:c.icon, colorSlot:c.colorSlot, total:0, prev:0 }));
  const idx = new Map(rows.map(r => [r.id, r]));
  let total = 0, income = 0, prevTotal = 0, months = 0, saving = 0;

  for (let m = 1; m <= 12; m++){
    const mk = year + "-" + pad2(m);
    const t = Sel.monthTotals(mk);
    if (t.expense !== 0 || t.income !== 0 || t.saving !== 0) months++;
    total += t.expense; income += t.income; saving += t.saving;
    Object.entries(t.totals).forEach(([id,v]) => { const r = idx.get(id); if (r) r.total += v; });

    const p = Sel.monthTotals((Number(year)-1) + "-" + pad2(m));
    prevTotal += p.expense;
    Object.entries(p.totals).forEach(([id,v]) => { const r = idx.get(id); if (r) r.prev += v; });
  }
  return {
    year, total, income, saving, net: income - total - saving, prevTotal, months,
    savingRate: income > 0 ? saving / income : null,
    avg: months ? total / months : 0,
    rows: rows.filter(r => r.total !== 0 || r.prev !== 0).sort((a,b) => b.total - a.total),
  };
});

/** サブスクの月次換算。v1は「月次のものだけ単純合計」していて、
 *  週次と年次を黙って無視していた。ここでは正しく換算する。 */
Sel.monthlyEquivalent = sub => {
  if (!sub || sub.status === "停止" || sub.status === "解約済み") return 0;
  const a = Number(sub.amount) || 0;
  if (sub.interval === "週次") return a * 52 / 12;
  if (sub.interval === "年次") return a / 12;
  return a;
};

/** カード（＝締め日を持つ支払方法）の支払予定。
 *  実取引とサブスク発生分をまとめて、それぞれの支払日で束ねる。 */
Sel.cardSchedule = memo(function(methodId){
  const m = byId(Store.state.methods, methodId);
  if (!m || !m.billing) return null;

  const today = new Date();
  const from = new Date(today.getFullYear(), today.getMonth() - 4, 1);
  const to   = new Date(today.getFullYear() + 1, today.getMonth(), 0);
  const entries = Sel.entriesInRange(fmt(from), fmt(to)).filter(e => e.methodId === methodId);

  const byPay = new Map();
  for (const e of entries){
    const sc = Sel.scheduleFor(methodId, e.date);
    if (!sc) continue;
    const key = fmt(sc.payDate);
    if (!byPay.has(key)) byPay.set(key, {
      payDate:key, cycleEnd:fmt(sc.cycleEnd), adjusted:sc.adjusted,
      rawPayDate:fmt(sc.rawPayDate), total:0, items:[],
    });
    const g = byPay.get(key);
    // 立替精算はその請求から差し引かれる
    g.total += e.type === "income" ? -e.amount : e.amount;
    g.items.push(e);
  }

  const todayStr_ = todayStr();
  const groups = Array.from(byPay.values())
    .sort((a,b) => a.payDate < b.payDate ? -1 : 1)
    .map(g => { g.items.sort((a,b) => a.date < b.date ? 1 : -1); g.past = g.payDate < todayStr_; return g; });

  return { method:m, account: m.billing.accountId ? Sel.acc(m.billing.accountId) : null,
           groups, upcoming: groups.filter(g => !g.past) };
});

/** 口座ごとの引落予定。残高は扱わない（口座残高は銀行アプリで直接見るものなので、
 *  ここで二重に管理させない）。締め日エンジンが既に持っている支払日と金額を
 *  引落先ごとに束ねるだけなので、ユーザーの入力・更新は要らない。 */
Sel.accountSchedule = memo(function(){
  const out = new Map();
  for (const m of Sel.activeMethods()){
    if (!m.billing) continue;
    const sc = Sel.cardSchedule(m.id);
    if (!sc) continue;
    const key = m.billing.accountId || "__none";
    if (!out.has(key)) out.set(key, {
      accountId: m.billing.accountId || null,
      name: m.billing.accountId && Sel.acc(m.billing.accountId) ? Sel.acc(m.billing.accountId).name : "口座の指定なし",
      byDate: new Map(), methods: [],
    });
    const a = out.get(key);
    a.methods.push(m.name);
    for (const g of sc.upcoming){
      if (!a.byDate.has(g.payDate)) a.byDate.set(g.payDate, { payDate:g.payDate, total:0, parts:[] });
      const d = a.byDate.get(g.payDate);
      d.total += g.total;
      d.parts.push({ method:m.name, total:g.total, adjusted:g.adjusted });
    }
  }
  return Array.from(out.values()).map(a => ({
    accountId:a.accountId, name:a.name, methods:a.methods,
    dates: Array.from(a.byDate.values()).sort((x,y) => x.payDate < y.payDate ? -1 : 1),
  })).sort((x,y) => x.name < y.name ? -1 : 1);
});

/** 締め日・支払日の設定を日本語1行で説明する */
Sel.billingText = function(b){
  if (!b) return "";
  const close = b.closeType === "月末" ? "月末締め" : (b.closeDay + "日締め");
  const mon = b.payOffset === 0 ? "当月" : b.payOffset === 1 ? "翌月" : "翌々月";
  const day = b.payDayType === "末日" ? "末日" : (b.payDay + "日");
  return close + " ／ " + mon + day + "払い";
};

/* ====================================================================
   §8 CHART — インラインSVGの手書き。ライブラリは使わない。
   ==================================================================== */
const Chart = {};

/** ドーナツ。1スライス=1要素なのでタップもVoiceOverも効く。 */
Chart.donut = function(slices, total){
  const R = 52, C = 2 * Math.PI * R, GAP = 2;   // 面の色で2pxあける（枠線は引かない）
  if (!total || !slices.length){
    return html`<svg class="donut" viewBox="0 0 120 120" role="img" aria-label="データなし">
      <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--line)" stroke-width="15"></circle>
      <text class="v" x="60" y="62" text-anchor="middle" style="fill:var(--ink-faint);font-size:9px">記録なし</text></svg>`;
  }
  let acc = 0;
  const arcs = slices.map(s => {
    const frac = s.value / total;
    const len  = Math.max(0, frac * C - GAP);
    const el = html`<circle class="seg" cx="60" cy="60" r="${R}" fill="none"
        stroke="${raw(slotVar(s.colorSlot))}" stroke-width="15"
        stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}"
        stroke-dashoffset="${(-acc * C).toFixed(2)}"
        data-act="status:drill" data-id="${s.id}"
      ><title>${s.name}：${yen(s.value)}（${Math.round(frac*100)}%）</title></circle>`;
    acc += frac;
    return el;
  });
  return html`<svg class="donut" viewBox="0 0 120 120" role="img"
      aria-label="用途別の内訳。合計 ${yen(total)}">
    <g transform="rotate(-90 60 60)">${arcs}</g>
    <g class="donut-center" text-anchor="middle">
      <text class="k" x="60" y="56">支出合計</text>
      <text class="v" x="60" y="68">${yen(total)}</text>
    </g>
  </svg>`;
};

/** 支出と収入の推移。2系列なので凡例を必ず出し、直近だけ値を直接置く。 */
Chart.trend = function(data){
  const W = 680, H = 190, PL = 46, PR = 10, PT = 12, PB = 26;
  const iw = W - PL - PR, ih = H - PT - PB;
  const max = Math.max(1, ...data.map(d => Math.max(d.expense, d.income, 0)));
  // 目盛りはきりのいい数字に丸める
  const step = Math.pow(10, Math.floor(Math.log10(max))) / 2;
  const top  = Math.ceil(max / step) * step;
  const ticks = [0, top/2, top];
  const y = v => PT + ih - (v / top) * ih;

  const band = iw / data.length;
  const bw   = Math.min(11, (band - 6) / 2);      // 棒は細く。24px上限より十分細い

  const bars = data.map((d,i) => {
    const cx = PL + band * i + band/2;
    const x1 = cx - bw - 1, x2 = cx + 1;          // 隣り合う棒の間も2pxあける
    const mk = (v0, x, cls) => {
      // 立替精算が上回るとマイナスになりうる。棒は0で止め、実額はツールチップで出す
      const v = Math.max(0, v0);
      const h = v > 0 ? Math.max(1.5, (v / top) * ih) : 0;
      if (!h) return "";
      // 上端だけ角を丸め、ベースラインは角のまま
      return html`<path class="bar" d="M${x.toFixed(1)} ${(PT+ih).toFixed(1)} L${x.toFixed(1)} ${(y(v)+3).toFixed(1)} Q${x.toFixed(1)} ${y(v).toFixed(1)} ${(x+3).toFixed(1)} ${y(v).toFixed(1)} L${(x+bw-3).toFixed(1)} ${y(v).toFixed(1)} Q${(x+bw).toFixed(1)} ${y(v).toFixed(1)} ${(x+bw).toFixed(1)} ${(y(v)+3).toFixed(1)} L${(x+bw).toFixed(1)} ${(PT+ih).toFixed(1)} Z" fill="${raw(cls)}"></path>`;
    };
    return html`<g class="bargroup">
      ${mk(d.expense, x1, "var(--s2)")}
      ${mk(d.income,  x2, "var(--s1)")}
      <rect class="hit" x="${(PL+band*i).toFixed(1)}" y="${PT}" width="${band.toFixed(1)}" height="${ih}"
        data-tip="${d.y}年${d.m}月　支出 ${yen(d.expense)}／収入 ${yen(d.income)}／収支 ${yen(d.net)}"></rect>
    </g>`;
  });

  const last = data[data.length-1];
  return html`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"
      role="img" aria-label="直近${data.length}ヶ月の支出と収入の推移">
    ${ticks.map(t => html`<line class="grid-line" x1="${PL}" x2="${W-PR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"></line>`)}
    ${ticks.map(t => html`<text class="axis-txt" x="${PL-6}" y="${(y(t)+3).toFixed(1)}" text-anchor="end">${t>=10000 ? Math.round(t/10000)+"万" : Math.round(t).toLocaleString("ja-JP")}</text>`)}
    ${bars}
    ${data.map((d,i) => (data.length <= 12 || i % 2 === 0)
      ? html`<text class="axis-txt" x="${(PL+band*i+band/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${d.m}月</text>` : "")}
    ${last && last.expense > 0
      ? html`<text class="axis-txt" x="${(PL+band*(data.length-1)+band/2).toFixed(1)}" y="${(y(last.expense)-6).toFixed(1)}" text-anchor="middle" style="fill:var(--ink);font-weight:800">${yen(last.expense)}</text>`
      : ""}
  </svg>`;
};

/* ====================================================================
   §6 ROUTER
   ==================================================================== */
const ROUTES = ["status","history","schedule","settings"];
function currentRoute(){
  const name = (location.hash || "").replace(/^#\/?/, "").split("/")[0];
  return ROUTES.includes(name) ? name : "status";
}
function route(){
  const r = currentRoute();
  $$("[data-route]").forEach(el => { el.hidden = el.dataset.route !== r; });
  $$("nav.tabbar button[data-to]").forEach(b =>
    b.setAttribute("aria-current", b.dataset.to === r ? "page" : "false"));
  Store.refreshStale();
  if (Store.state && Store.state.prefs.lastRoute !== r)
    Store.commit(s => { s.prefs.lastRoute = r; }, D.PREF);
  window.scrollTo(0,0);
}
const go = to => { location.hash = "#/" + to; };
